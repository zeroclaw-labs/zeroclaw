<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZeroClaw</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0e1116;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #2f81f7;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fa;
          --panel: #ffffff;
          --text: #1f2328;
          --muted: #59636e;
          --border: #d1d9e0;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 22px;
        padding: 32px;
        text-align: center;
      }
      .mark {
        font-size: 52px;
        line-height: 1;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .status {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
        max-width: 360px;
        min-height: 38px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        opacity: 0;
        transition: opacity 0.4s ease;
        max-width: 360px;
        line-height: 1.5;
      }
      .hint.show { opacity: 0.85; }
      .error { color: #f85149; }
    </style>
  </head>
  <body>
    <div class="mark">🦀</div>
    <h1>ZeroClaw</h1>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Starting ZeroClaw…</p>
    <p class="hint" id="hint">
      Connecting to your ZeroClaw daemon. This usually takes a moment.
    </p>

    <script>
      const statusEl = document.getElementById("status");
      const hintEl = document.getElementById("hint");
      const spinnerEl = document.getElementById("spinner");

      function invoke(cmd, args) {
        const fn = window.__TAURI__?.core?.invoke;
        if (!fn) return Promise.reject(new Error("Tauri IPC bridge unavailable"));
        return fn(cmd, args);
      }

      // The backend owns startup. `get_startup` says whether the dashboard
      // may open (`ready`), why it may not (`failed`), or what is happening
      // (`pending`), and `open_dashboard` refuses unless startup is ready.
      // This page only follows that state; it never decides readiness from
      // the gateway's HTTP health, which any program on the port can answer.
      let failed = false;
      let launching = false;
      let attempts = 0;

      function showFailure(message) {
        failed = true;
        spinnerEl.style.display = "none";
        statusEl.classList.add("error");
        statusEl.textContent = message || "ZeroClaw couldn't start.";
        hintEl.classList.remove("show");
      }

      async function tick() {
        if (launching || failed) return;
        attempts += 1;

        let startup = null;
        try {
          startup = await invoke("get_startup");
        } catch (err) {
          // IPC not ready yet — keep polling.
          startup = null;
        }
        // A failure, or another check, may have landed while this one waited.
        if (launching || failed) return;

        if (startup?.state === "failed") {
          showFailure(startup.message);
          return;
        }
        if (startup?.state !== "ready") {
          if (startup?.message) statusEl.textContent = startup.message;
          // After several seconds still starting, surface a fallback hint.
          if (attempts >= 6) hintEl.classList.add("show");
          return;
        }

        launching = true;
        statusEl.classList.remove("error");
        statusEl.textContent = "Opening your dashboard…";
        hintEl.classList.remove("show");
        spinnerEl.style.display = "";
        try {
          await invoke("open_dashboard");
          // On success the backend closes this splash window.
        } catch (err) {
          launching = false;
          spinnerEl.style.display = "none";
          statusEl.classList.add("error");
          statusEl.textContent =
            "Couldn't open the dashboard: " + String(err?.message ?? err);
        }
      }

      // The backend announces each startup change; read the state again at
      // once rather than waiting for the next poll. A missed event only costs
      // one poll interval.
      window.__TAURI__?.event
        ?.listen("zeroclaw://startup", (event) => {
          if (event.payload?.state === "failed") {
            showFailure(event.payload.message);
          } else {
            tick();
          }
        })
        .catch(() => {});

      tick();
      setInterval(tick, 1200);
    </script>
  </body>
</html>

[package]
name = "zeroclaw-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Personal agent runtime, security, observability, cron, skills, and authorized tool assembly."
publish = false

[dependencies]
zeroclaw-policy.workspace = true
zeroclaw-cost.workspace = true
zeroclaw-platform.workspace = true
zeroclaw-http.workspace = true
zeroclaw-api.workspace = true
zeroclaw-spawn.workspace = true
zeroclaw-infra.workspace = true
zeroclaw-config = { workspace = true, features = ["i18n"] }
zeroclaw-log.workspace = true
zeroclaw-providers.workspace = true
zeroclaw-memory.workspace = true
zeroclaw-tools.workspace = true
zeroclaw-tool-call-parser.workspace = true
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
console = "0.16"
cron = "0.15"
directories = "6.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
glob = "0.3"
hex = "0.4"
hmac = "0.12"
hostname = "0.4.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
parking_lot = "0.12"
pulldown-cmark = "0.13"
rand = "0.10"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "__rustls-ring", "blocking", "multipart", "stream", "socks"] }
ring = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
schemars = { version = "1.2", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
shellexpand = "3.1"
# Pinned to 0.36 because 0.37+ requires rustc 1.88; workspace MSRV is 1.87.
# Used only by `process_stats.rs` to sample this process's RSS/CPU% across
# Linux, macOS, Windows, and FreeBSD. `default-features = false` drops the
# multi-threaded refresh path (we sample a single pid).
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tempfile = "3.26"
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["fs", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
toml = "1.0"
url = "2.5"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }
which = "8.0"
zeroclaw-macros.workspace = true

# Optional deps
prometheus = { version = "0.14", default-features = false, optional = true }
# Optional deps for specific features

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Descriptor-bound `openat`-family containment primitives for the
# `personal_file` safe core (LA1): no-follow component opens, renameat
# no-clobber, descriptor identity checks. Unix-only; every other
# platform fails closed with `unsupported_safely`.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Globalization"] }
encoding_rs = "0.8"

[features]
default = [
    "observability-prometheus",
    "schema-export",
    "email-tools",
]
observability-prometheus = ["dep:prometheus"]
sandbox-landlock = ["dep:landlock"]
schema-export = ["dep:schemars", "zeroclaw-config/schema-export"]


# Concrete integration families from zeroclaw-tools. Default-on so this
# crate's standalone build and test surface are unchanged; the root package
# consumes this crate with default-features = false and forwards these from
# its own default so the slim companion selection can omit them.
email-tools = ["zeroclaw-tools/email-tools"]
memory-tachi = ["zeroclaw-memory/tachi"]
sandbox-bubblewrap = []
# Heavy agent behavioral suites. Gated so lib-test
# iteration does not compile them; CI runtime leg enables this feature.
heavy-tests = []

[dev-dependencies]
zeroclaw-config = { workspace = true, features = ["test-helpers"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
encoding_rs = "0.8"
rcgen = "0.13"
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
scopeguard = "1.2"
filetime = "0.2"
wiremock = "0.6"
# Test-only registry constructor used by the daemon heartbeat MCP
# retry-regression tests. Not in default deps so
# the helper is unreachable from production builds.
zeroclaw-tools = { workspace = true, features = ["test-helpers"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zeroclaw_root_crate)'] }

# Canonical on-disk manifest for the channel component fixture.
#
# The activation end-to-end test installs this file verbatim as a package's
# `manifest.toml`, so it doubles as a worked example of the manifest an
# operator would receive with a real channel plugin.
name = "channel-fixture"
version = "0.0.0"
description = "Channel component fixture used by the plugin activation tests."
wasm_path = "channel-fixture.wasm"
capabilities = ["channel"]
permissions = ["config_read"]

# The guest refuses to configure unless it receives a typed `retry_count` of 5, a
# non-empty `credential_epoch`, and a scoped `api_token` secret. That is what
# makes the end-to-end test prove operator values and secrets reached a real
# component through the typed resolver and scoped-secret service, rather than
# being dropped. `config_read` grants both `config.get` and `secrets.get`;
# channels have no outbound-HTTP surface, so no `http_client` grant is needed.
[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["retry_count", "credential_epoch", "api_token"]
additionalProperties = false

[config_schema.properties.retry_count]
type = "integer"
minimum = 1

[config_schema.properties.credential_epoch]
type = "string"
minLength = 1

[config_schema.properties.api_token]
type = "string"
minLength = 1
x-secret = true

[config_schema.properties.handle]
type = "string"

[package]
name = "zeroclaw-egress-plugin-fixture"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doc = false
doctest = false
test = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.51"
# Guest-side `wasi:http` bindings. The ZeroClaw WIT worlds declare only
# ZeroClaw interfaces; `wasi:http` reaches the guest through the wasip2 target,
# and the host links it only for stores built from an `HttpClient` grant.
wasi = "0.14"

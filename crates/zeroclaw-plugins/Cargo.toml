[package]
name = "zeroclaw-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM plugin system for ZeroClaw — host, manifests, signatures, execution bridge."
publish = false

[features]
default = ["plugins-wit-v0"]
plugins-wit-v0 = []
plugins-wasmtime = [
  "dep:wasmtime",
  "dep:wasmtime-wasi",
  "dep:wasmtime-wasi-http",
  # The host-owned pinned send path: the shared egress boundary hands back a
  # validated address, and this adapter dials it. These are the same crates
  # (and the same locked versions) `wasmtime-wasi-http`'s own
  # `default-send-request` pulls in, so enabling them adds no new compilation
  # units to the workspace build.
  "dep:hyper",
  "dep:http-body-util",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:webpki-roots",
]
plugins-wasm-cranelift = ["plugins-wasmtime", "wasmtime/cranelift"]
plugins-wasm-pulley = ["plugins-wasmtime", "wasmtime/pulley"]

[dependencies]
zeroclaw-log.workspace = true
zeroclaw-api.workspace = true
zeroclaw-infra.workspace = true
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
jsonschema = { version = "0.48", default-features = false }
ring = "0.17"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["sync", "macros", "net", "rt", "time"] }
toml = "1.0"
toml_edit = "0.25"
wasmtime = { version = "47.0.4", default-features = false, features = [
  "component-model",
  "runtime",
  "std",
  "async",
], optional = true }
wasmtime-wasi = { version = "47.0.4", default-features = false, features = [
  "p2",
], optional = true }
wasmtime-wasi-http = { version = "47.0.4", default-features = false, features = [
  "p2",
  "default-send-request",
], optional = true }
hyper = { version = "1", default-features = false, features = ["http1", "client"], optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
webpki-roots = { version = "1.0.6", optional = true }

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", default-features = false, features = ["io-util", "net"] }
zeroclaw-config = { path = "../zeroclaw-config" }
zeroclaw-spawn.workspace = true

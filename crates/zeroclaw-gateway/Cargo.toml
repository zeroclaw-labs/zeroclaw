[package]
name = "zeroclaw-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/WebSocket gateway for ZeroClaw — REST API, web dashboard, webhooks."
publish = false

[dependencies]
zeroclaw-policy.workspace = true
# Internal workspace crates
zeroclaw-api.workspace = true
zeroclaw-spawn.workspace = true
zeroclaw-config.workspace = true
zeroclaw-infra.workspace = true
zeroclaw-log.workspace = true
zeroclaw-memory.workspace = true
zeroclaw-providers.workspace = true
zeroclaw-runtime.workspace = true
zeroclaw-tools.workspace = true

# HTTP server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "fs"] }
http-body-util = "0.1"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }

# Frontend asset MIME type detection (dashboard served from filesystem)
mime_guess = "2"

include_dir = { version = "0.7", optional = true }
schemars = { version = "1.2", optional = true }


# Async runtime
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal", "process"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
socket2 = "0.6"

# Error handling
anyhow = "1.0"
async-trait = "0.1"
directories = "6.0"

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ring = { version = "0.17", optional = true }

# Database (session queue)
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }

# Misc
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
parking_lot = "0.12"
toml = "1.0"
toml_edit = "0.25"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

# Unix-only: self-signal SIGTERM to trigger the daemon's graceful shutdown for
# supervised post-upgrade restart (version.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zeroclaw-gateway-client.workspace = true
rand = "0.10"
rcgen = "0.13"
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[features]
default = ["schema-export"]
# Node discovery surface (`/ws/nodes` WebSocket registry + LAN mDNS peer
# hints + the node tool). Default-off; enable with `--features nodes`.
# The `[nodes]` / `[nodes.mdns]` config types stay unconditional in
# zeroclaw-config (schema.rs is a hot upstream file — not worth the churn).
nodes = ["dep:ring"]
memory-tachi = ["zeroclaw-memory/tachi"]
observability-prometheus = ["zeroclaw-runtime/observability-prometheus"]
gateway-voice-duplex = []
# Explicit opt-in to spoken-text presentation; no audio transport.
voice-surface = []
# Enables OPTIONS /api/config* responses with the schemars-generated
# JSON Schema body. Turning it off returns a small placeholder instead.
schema-export = ["zeroclaw-config/schema-export", "zeroclaw-runtime/schema-export", "dep:schemars"]
embedded-web = ["dep:include_dir"]

[[test]]
name = "nodes_mdns"
required-features = ["nodes"]

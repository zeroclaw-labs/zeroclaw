[package]
name = "zeroclaw-goal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-neutral Goal Mode policy and execution contracts."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-commands.workspace = true
zeroclaw-config.workspace = true
zeroclaw-spawn.workspace = true
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["rt", "sync", "macros"] }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }
zeroclaw-log.workspace = true

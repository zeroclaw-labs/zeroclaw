[package]
name = "zeroclaw-colony"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = true
description = "Queen-led reusable agent teams and durable Colony orchestration for ZeroClaw."
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
schemars = { version = "1.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.18", features = ["v4"] }
zeroclaw-api.workspace = true
zeroclaw-config.workspace = true
zeroclaw-log.workspace = true
zeroclaw-infra.workspace = true
zeroclaw-memory.workspace = true
zeroclaw-runtime.workspace = true

[dev-dependencies]
axum = "0.8"
tempfile = "3.23"
zeroclaw-spawn.workspace = true

[features]
default = ["schema-export"]
schema-export = ["dep:schemars", "zeroclaw-config/schema-export", "zeroclaw-runtime/schema-export"]

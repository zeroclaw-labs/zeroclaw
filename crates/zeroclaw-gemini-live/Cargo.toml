[package]
name = "zeroclaw-gemini-live"
version.workspace = true
# Vendored from the `gemini-live` crate; see PROVENANCE.md. It keeps its own
# edition and MIT license so the vendor stays diffable against the origin
# commit, and takes the workspace version so the coordinated release publishes
# it before the channel that depends on it.
edition = "2021"
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "A focused Rust client for the Google Gemini Live API: wire serialization, message parsing, WebSocket transport, and a reconnect/resumption session driver."
publish = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "net", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
async-http-proxy = { version = "1.2", features = ["runtime-tokio", "basic-auth"] }
futures-util = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "macros", "test-util", "time", "sync"] }

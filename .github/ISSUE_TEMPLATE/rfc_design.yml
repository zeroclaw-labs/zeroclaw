name: RFC / Design Proposal
description: Propose a significant architecture, governance, or user-facing direction change
title: "RFC: "
labels:
  - "type:rfc"
body:
  - type: markdown
    attributes:
      value: |
        An RFC is for decisions the project must make **before** anyone can implement.
        It is not a heavier feature request, and filing one for work that does not need a
        project-level decision adds review latency without adding review.

        Ordinary features, configuration fields and defaults, schema or data migrations, and
        bounded refactors go straight to an issue and a PR. Use the **Feature Request**
        template instead. Security vulnerabilities must be reported privately; see `SECURITY.md`.

  - type: dropdown
    id: trigger
    attributes:
      label: Which project-level trigger applies?
      description: >
        Pick the trigger this proposal actually meets. If none of them fit, this is ordinary
        work. Close this form and use the Feature Request template. Maintainers may close an
        RFC as an ordinary issue when it does not meet a trigger; the underlying work stays
        valid and continues on the redirected issue or PR.
      options:
        - A new security layer, or a material change to the security model
        - A governance, contribution-process, or project-authority change
        - A cross-cutting refactor that changes ownership or contracts across established boundaries
        - A new subsystem, or another project-wide capability boundary
        - None of these: I will use the Feature Request template instead
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain, project risk, or system gap motivates this proposal?
      placeholder: The current design makes it hard to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
      placeholder: I propose ...
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design sketch
      description: Include interface shape, affected surfaces, rollout phases, or links to a proposal PR.
      placeholder: |
        Affected surfaces:
        Proposed phases:
        Proposal PR or discussion:
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        What other paths did you consider, including doing nothing? If the only real
        alternative is "do not build it", the proposal is probably an ordinary feature
        rather than a decision the project has to settle first.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is explicitly out of scope for this proposal?
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks and mitigations
      description: What could go wrong, and how would the project roll back or contain it?
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change?
      options:
        - "No"
        - "Yes - existing configurations, APIs, or defaults change"
        - "Potentially - needs investigation"
    validations:
      required: true

  - type: textarea
    id: decision_surface
    attributes:
      label: Decision and revisit surface
      description: Where should discussion, acceptance, follow-up issues, or later revisit happen?
      placeholder: This issue, linked proposal PR, linked discussion, milestone, or maintainer meeting.
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene checks
      options:
        - label: I removed personal/sensitive data from examples, payloads, and logs.
          required: true

name: Advisory Windows Tests
run-name: "Windows tests for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # Unrelated label events must not cancel an opted-in run or replace its queue slot.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:windows' && github.run_id || 'selected' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Use the ordinary read-only PR event, including its fork approval protections.
# The label controls cost, not authorization to execute privileged code.
jobs:
  windows-test-scope:
    name: Advisory Windows test selection
    if: contains(github.event.pull_request.labels.*.name, 'ci:windows') && (github.event.action != 'labeled' || github.event.label.name == 'ci:windows')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      packages: ${{ steps.select.outputs.packages }}
      reason: ${{ steps.select.outputs.reason }}
      needs_plugin_host: ${{ steps.select.outputs.needs_plugin_host }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Record tested revision
        shell: bash
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Test Windows selector contract
        run: bash scripts/ci/windows_test_scope.test.sh
      - name: Select Windows nextest scope
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/windows-changed-files"
          metadata_file="$RUNNER_TEMP/windows-cargo-metadata.json"
          : > "$changed_files"

          git diff --name-only "$BASE_SHA" HEAD > "$changed_files"
          if ! cargo metadata --locked --format-version 1 > "$metadata_file"; then
            rm -f "$metadata_file"
          fi

          python3 scripts/ci/windows_test_scope.py \
            --event pull_request \
            --changed-paths-file "$changed_files" \
            --metadata-file "$metadata_file" \
            --repo-root "$GITHUB_WORKSPACE" > "$GITHUB_OUTPUT"
      - name: Report Windows selection
        shell: bash
        env:
          MODE: ${{ steps.select.outputs.mode }}
          PACKAGES: ${{ steps.select.outputs.packages }}
          REASON: ${{ steps.select.outputs.reason }}
          NEEDS_PLUGIN_HOST: ${{ steps.select.outputs.needs_plugin_host }}
        run: |
          {
            echo "### Advisory Windows test selection"
            echo ""
            printf "| Field | Value |\n"
            printf "| --- | --- |\n"
            printf "| Mode | %s |\n" "$MODE"
            printf "| Packages | %s |\n" "$PACKAGES"
            printf "| Reason | %s |\n" "$REASON"
            printf "| Plugin host required | %s |\n" "$NEEDS_PLUGIN_HOST"
            printf "| Measured nextest duration | not run (selection only) |\n"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-test:
    name: Advisory Windows nextest (${{ needs.windows-test-scope.outputs.mode }}, plugin-host=${{ needs.windows-test-scope.outputs.needs_plugin_host }})
    needs: [windows-test-scope]
    if: needs.windows-test-scope.outputs.mode != 'skip'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Install plugin fixture target
        if: needs.windows-test-scope.outputs.needs_plugin_host == 'true'
        run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-test
          cache-on-failure: true
          save-if: false
      - name: Ensure web/dist placeholder exists
        shell: bash
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Install cargo-nextest
        shell: bash
        env:
          NEXTEST_VERSION: 0.9.143
          NEXTEST_SHA256: c42a1dbde532da06dc9b4a43d44fd0ce668b836c2ab7388410f10ff9834476a2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-pc-windows-msvc.tar.gz"
          curl -LsSf --retry 3 --retry-delay 2 -o "$archive" "$url"
          actual_sha256="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$archive")"
          if [[ "$actual_sha256" != "$NEXTEST_SHA256" ]]; then
            echo "::error::cargo-nextest checksum mismatch (expected $NEXTEST_SHA256, got $actual_sha256)"
            exit 1
          fi
          if command -v cygpath >/dev/null 2>&1; then
            archive="$(cygpath -u "$archive")"
          fi
          tar zxf "$archive" -C "$HOME/.cargo/bin"
      - name: Run advisory Windows tests
        shell: bash
        env:
          MODE: ${{ needs.windows-test-scope.outputs.mode }}
          PACKAGES_JSON: ${{ needs.windows-test-scope.outputs.packages }}
          REASON: ${{ needs.windows-test-scope.outputs.reason }}
          NEEDS_PLUGIN_HOST: ${{ needs.windows-test-scope.outputs.needs_plugin_host }}
        run: |
          set -euo pipefail

          started_at=$SECONDS
          baseline_log="$RUNNER_TEMP/windows-baseline-nextest.log"
          plugin_components_log="$RUNNER_TEMP/windows-plugin-components-nextest.log"
          plugin_lib_log="$RUNNER_TEMP/windows-plugin-lib-nextest.log"
          plugin_runtime_config_log="$RUNNER_TEMP/windows-plugin-runtime-config-nextest.log"
          plugin_runtime_admission_log="$RUNNER_TEMP/windows-plugin-runtime-admission-nextest.log"
          plugin_gateway_log="$RUNNER_TEMP/windows-plugin-gateway-nextest.log"
          plugin_cli_log="$RUNNER_TEMP/windows-plugin-cli-nextest.log"
          plugin_root_log="$RUNNER_TEMP/windows-plugin-root-nextest.log"
          hardware_log="$RUNNER_TEMP/windows-hardware-nextest.log"
          case "$MODE" in
            scoped)
              package_args_file="$RUNNER_TEMP/windows-package-args"
              if ! python3 scripts/ci/windows_test_scope.py --package-args-json "$PACKAGES_JSON" > "$package_args_file"; then
                echo "::error::Invalid scoped Windows package selection"
                baseline_status=2
              else
                mapfile -t package_args < "$package_args_file"
                if (( ${#package_args[@]} == 0 )); then
                  echo "::error::Scoped Windows package selection is empty"
                  baseline_status=2
                else
                  set +e
                  cargo nextest run --locked --no-fail-fast "${package_args[@]}" 2>&1 | tee "$baseline_log"
                  baseline_status=${PIPESTATUS[0]}
                  set -e
                fi
              fi
              ;;
            full)
              set +e
              cargo nextest run --locked --no-fail-fast --workspace --exclude zeroclaw-desktop 2>&1 | tee "$baseline_log"
              baseline_status=${PIPESTATUS[0]}
              set -e
              ;;
            *)
              echo "::error::Unknown Windows test selection mode: $MODE"
              baseline_status=2
              ;;
          esac

          baseline_duration=$((SECONDS - started_at))
          hardware_started_at=$SECONDS
          set +e
          cargo nextest run --locked --no-fail-fast -p zeroclaw-hardware --features hardware --lib 2>&1 | tee "$hardware_log"
          hardware_status=${PIPESTATUS[0]}
          set -e
          hardware_duration=$((SECONDS - hardware_started_at))
          plugin_host_status=0
          plugin_host_duration=0
          plugin_components_status=not-run
          plugin_lib_status=not-run
          plugin_runtime_config_status=not-run
          plugin_runtime_admission_status=not-run
          plugin_gateway_status=not-run
          plugin_cli_status=not-run
          plugin_root_status=not-run
          if [[ "$NEEDS_PLUGIN_HOST" == "true" ]]; then
            plugin_started_at=$SECONDS
            set +e
            cargo nextest run --locked --no-fail-fast \
              -p zeroclaw-plugins \
              --features plugins-wasm-cranelift \
              --test channel_plugin_e2e \
              --test tool_plugin_timeout_e2e \
              --test reference_plugin \
              --test reference_plugin_e2e \
              --test tool_plugin_e2e 2>&1 | tee "$plugin_components_log"
            plugin_components_status=${PIPESTATUS[0]}
            cargo nextest run --locked --no-fail-fast \
              -p zeroclaw-plugins \
              --no-default-features \
              --features plugins-wasm-cranelift \
              --lib 2>&1 | tee "$plugin_lib_log"
            plugin_lib_status=${PIPESTATUS[0]}
            cargo nextest run --locked --no-fail-fast \
              -p zeroclaw-runtime \
              --features plugins-wasm-cranelift \
              --lib \
              live_agent_plugin_tool_observes_config_reload_after_construction 2>&1 | tee "$plugin_runtime_config_log"
            plugin_runtime_config_status=${PIPESTATUS[0]}
            cargo nextest run --locked --no-fail-fast \
              -p zeroclaw-runtime \
              --features plugins-wasm-cranelift \
              --lib \
              plugin_runtime:: \
              tools::tests::shared_ceiling \
              tools::tests::repeated_loader \
              tools::tests::auto_discover \
              tools::tests::colliding_plugin 2>&1 | tee "$plugin_runtime_admission_log"
            plugin_runtime_admission_status=${PIPESTATUS[0]}
            cargo nextest run --locked --no-fail-fast \
              -p zeroclaw-gateway \
              --features plugins-wasm \
              --lib 2>&1 | tee "$plugin_gateway_log"
            plugin_gateway_status=${PIPESTATUS[0]}
            cargo nextest run --locked --no-fail-fast \
              --features plugins-wasm-cranelift \
              --bin zeroclaw \
              plugin_registry:: plugins:: egress 2>&1 | tee "$plugin_cli_log"
            plugin_cli_status=${PIPESTATUS[0]}
            cargo nextest run --locked --no-fail-fast \
              --features plugins-wasm-cranelift \
              --test plugin_channel_runtime_e2e \
              --test channel_egress_e2e 2>&1 | tee "$plugin_root_log"
            plugin_root_status=${PIPESTATUS[0]}
            set -e
            plugin_host_duration=$((SECONDS - plugin_started_at))
            if (( plugin_components_status != 0 || plugin_lib_status != 0 || plugin_runtime_config_status != 0 || plugin_runtime_admission_status != 0 || plugin_gateway_status != 0 || plugin_cli_status != 0 || plugin_root_status != 0 )); then
              plugin_host_status=1
            fi
          fi

          overall_status=$baseline_status
          if (( hardware_status != 0 )); then
            overall_status=1
          fi
          if (( plugin_host_status != 0 )); then
            overall_status=1
          fi
          failure_inventory=""
          if (( baseline_status != 0 )); then
            failure_inventory="baseline"
          fi
          if (( hardware_status != 0 )); then
            failure_inventory="${failure_inventory:+$failure_inventory,}hardware"
          fi
          if [[ "$plugin_components_status" != "not-run" && "$plugin_components_status" != "0" ]]; then
            failure_inventory="${failure_inventory:+$failure_inventory,}plugin-components"
          fi
          if [[ "$plugin_lib_status" != "not-run" && "$plugin_lib_status" != "0" ]]; then
            failure_inventory="${failure_inventory:+$failure_inventory,}plugin-lib"
          fi
          if [[ "$plugin_runtime_config_status" != "not-run" && "$plugin_runtime_config_status" != "0" ]]; then
            failure_inventory="${failure_inventory:+$failure_inventory,}plugin-runtime-config"
          fi
          if [[ "$plugin_runtime_admission_status" != "not-run" && "$plugin_runtime_admission_status" != "0" ]]; then
            failure_inventory="${failure_inventory:+$failure_inventory,}plugin-runtime-admission"
          fi
          if [[ "$plugin_gateway_status" != "not-run" && "$plugin_gateway_status" != "0" ]]; then
            failure_inventory="${failure_inventory:+$failure_inventory,}plugin-gateway"
          fi
          if [[ "$plugin_cli_status" != "not-run" && "$plugin_cli_status" != "0" ]]; then
            failure_inventory="${failure_inventory:+$failure_inventory,}plugin-cli"
          fi
          if [[ "$plugin_root_status" != "not-run" && "$plugin_root_status" != "0" ]]; then
            failure_inventory="${failure_inventory:+$failure_inventory,}plugin-root"
          fi
          if [[ -z "$failure_inventory" ]]; then
            failure_inventory=none
          fi
          total_duration=$((SECONDS - started_at))
          {
            echo "### Advisory Windows nextest"
            echo ""
            printf "| Field | Value |\n"
            printf "| --- | --- |\n"
            printf "| Mode | %s |\n" "$MODE"
            printf "| Packages | %s |\n" "$PACKAGES_JSON"
            printf "| Reason | %s |\n" "$REASON"
            printf "| Plugin host required | %s |\n" "$NEEDS_PLUGIN_HOST"
            printf "| Baseline status | %s |\n" "$baseline_status"
            printf "| Hardware feature status | %s |\n" "$hardware_status"
            printf "| Plugin-host component status | %s |\n" "$plugin_components_status"
            printf "| Plugin-host library status | %s |\n" "$plugin_lib_status"
            printf "| Plugin-host runtime config status | %s |\n" "$plugin_runtime_config_status"
            printf "| Plugin-host runtime admission status | %s |\n" "$plugin_runtime_admission_status"
            printf "| Plugin-host gateway status | %s |\n" "$plugin_gateway_status"
            printf "| Plugin-host CLI status | %s |\n" "$plugin_cli_status"
            printf "| Plugin-host root status | %s |\n" "$plugin_root_status"
            printf "| Failure inventory | %s |\n" "$failure_inventory"
            printf "| Baseline duration | %ss |\n" "$baseline_duration"
            printf "| Hardware feature duration | %ss |\n" "$hardware_duration"
            printf "| Plugin-host duration | %ss |\n" "$plugin_host_duration"
            printf "| Total duration | %ss |\n" "$total_duration"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$overall_status"

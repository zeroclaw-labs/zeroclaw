name: Discord Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Stable release tag (e.g. v0.8.5)"
        required: true
        type: string
      release_url:
        description: "GitHub Release URL"
        required: true
        type: string
      dry_run:
        description: "Compose and print the message without publishing it"
        required: false
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.8.5)"
        required: true
        type: string
      release_url:
        description: "GitHub Release URL (defaults to the release page for the tag)"
        required: false
        type: string
      dry_run:
        description: "Compose and print the message without publishing it"
        required: false
        type: boolean
        default: false

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Build Discord message
        id: msg
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_URL: ${{ inputs.release_url || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_URL" ]; then
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          fi
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

          # Find previous stable tag
          PREV_STABLE=$(git tag --sort=-creatordate \
            | grep -v "^${RELEASE_TAG}$" \
            | grep -vE '\-beta\.' \
            | head -1 || echo "")

          # Preferred: the release author's "## In brief" section from the
          # published release notes, plus the Highlights bullets (an embed
          # description has room for them), the counts, and a link to the
          # website's release post when one exists for this tag.
          NOTES_FILE="$(mktemp)"
          if gh release view "$RELEASE_TAG" --json body --jq .body > "$NOTES_FILE" 2>/dev/null \
            && [ -s "$NOTES_FILE" ] \
            && BODY="$(scripts/ci/release_post_text.sh \
                --notes "$NOTES_FILE" --tag "$RELEASE_TAG" --prev "$PREV_STABLE" \
                --highlights 6 --limit 3500 \
                --site-feed https://www.zeroclaw.com/blog/rss.xml --fallback-link "$RELEASE_URL")"; then
            {
              echo "body<<MSG_EOF"
              echo "$BODY"
              echo "MSG_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Release notes for ${RELEASE_TAG} unavailable or without In brief/Highlights; using the commit list"

          RANGE="${PREV_STABLE:+${PREV_STABLE}..}${RELEASE_TAG}"

          # Extract features
          FEATURES=$(git log "$RANGE" --pretty=format:"%s" --no-merges \
            | grep -iE '^feat(\(|:)' \
            | sed 's/^feat(\([^)]*\)): /\1: /' \
            | sed 's/^feat: //' \
            | sed 's/ (#[0-9]*)$//' \
            | sort -uf || true)

          # Extract fixes
          FIXES=$(git log "$RANGE" --pretty=format:"%s" --no-merges \
            | grep -iE '^fix(\(|:)' \
            | sed 's/^fix(\([^)]*\)): /\1: /' \
            | sed 's/^fix: //' \
            | sed 's/ (#[0-9]*)$//' \
            | sort -uf || true)

          FEAT_LIST=""
          if [ -n "$FEATURES" ]; then
            FEAT_LIST=$(echo "$FEATURES" | head -8 | while IFS= read -r line; do echo "🚀 ${line}"; done)
          fi

          FIX_LIST=""
          if [ -n "$FIXES" ]; then
            FIX_LIST=$(echo "$FIXES" | head -5 | while IFS= read -r line; do echo "🔧 ${line}"; done)
          fi

          BODY=""
          if [ -n "$FEAT_LIST" ]; then
            BODY="${FEAT_LIST}"
          fi
          if [ -n "$FIX_LIST" ]; then
            [ -n "$BODY" ] && BODY="${BODY}\n"
            BODY="${BODY}${FIX_LIST}"
          fi
          if [ -z "$BODY" ]; then
            BODY="🚀 Incremental improvements and polish"
          fi

          {
            echo "body<<MSG_EOF"
            echo -e "$BODY"
            echo "MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: inputs.dry_run == true
        env:
          MSG_BODY: ${{ steps.msg.outputs.body }}
        run: |
          {
            echo "## Discord message preview (dry run, nothing published)"
            echo
            echo '```'
            echo "$MSG_BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: nothing published."

      - name: Post to Discord
        if: inputs.dry_run != true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_URL: ${{ steps.msg.outputs.release_url }}
          MSG_BODY: ${{ steps.msg.outputs.body }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret not configured — skipping"
            exit 0
          fi

          # Build Discord embed payload. The body's last line is the link the
          # composer chose (the website post when one exists); the embed title
          # links there and the release page is named separately when it
          # differs, so readers reach both.
          PAYLOAD=$(python3 -c "
          import json, os
          tag = os.environ['RELEASE_TAG']
          release_url = os.environ['RELEASE_URL']
          body = os.environ['MSG_BODY'].rstrip()
          lines = body.split('\n')
          link = lines[-1].strip() if lines and lines[-1].strip().startswith('http') else release_url
          if link != release_url and lines and lines[-1].strip() == link:
              body = '\n'.join(lines[:-1]).rstrip() + f'\n\nRelease notes: {release_url}'

          embed = {
              'title': f'ZeroClaw {tag}',
              'description': body,
              'url': link,
              'color': 0xF97316,
              'footer': {'text': 'ZeroClaw Release Bot'},
          }

          payload = {
              'username': 'ZeroClaw Releases',
              'embeds': [embed],
          }
          print(json.dumps(payload))
          ")

          HTTP_CODE=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Discord notification sent (HTTP $HTTP_CODE)"
          else
            echo "::error::Discord webhook failed (HTTP $HTTP_CODE)"
            cat /tmp/discord_response.txt
            exit 1
          fi

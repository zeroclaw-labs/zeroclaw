name: Android app

on:
  push:
    branches: [master, "feat/**", "fix/**", "release/**"]
    paths:
      - "apps/android/**"
      - "src/**"
      - "crates/**"
      - "xtask/**"
      - "web/**"
      - ".cargo/**"
      - ".nvmrc"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "src/**"
      - "crates/**"
      - "xtask/**"
      - "web/**"
      - ".cargo/**"
      - ".nvmrc"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

concurrency:
  group: android-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out ZeroClaw
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.96.1
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: android-app-aarch64-linux-android
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate credential-free provider defaults
        run: |
          python3 -m unittest discover -s apps/android/scripts/tests -p 'test_*.py'
          apps/android/scripts/check-model-defaults.py

      - name: Build web dashboard
        run: |
          cargo web build
          # Current Cargo can normalize an equivalent package qualifier while xtask runs.
          git restore Cargo.lock
          git diff --exit-code

      - name: Build Android ZeroClaw
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a build --release --locked -p zeroclaw --bin zeroclaw

      - name: Stage native payload, dashboard, and Android skill
        env:
          ZC_BIN: ${{ github.workspace }}/target/aarch64-linux-android/release/zeroclaw
        run: apps/android/scripts/stage-jnilibs.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: 1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run full and lite Android matrix
        working-directory: apps/android
        env:
          ZEROCLAW_REF: ${{ github.ref_name }}
          ZEROCLAW_COMMIT: ${{ github.sha }}
        run: |
          ./gradlew --no-daemon \
            :app:testLiteDebugUnitTest \
            :app:testFullDebugUnitTest \
            :app:testLiteReleaseUnitTest \
            :app:testFullReleaseUnitTest \
            :app:lintLiteDebug \
            :app:lintFullDebug \
            :app:lintLiteRelease \
            :app:lintFullRelease \
            :app:assembleLiteDebug \
            :app:assembleFullDebug \
            -PZEROCLAW_REF="$ZEROCLAW_REF" \
            -PZEROCLAW_COMMIT="$ZEROCLAW_COMMIT" \
            --console=plain

      - name: Upload non-release debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerodroid-debug-apks
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/android/app/build/outputs/apk/full/debug/*.apk
            apps/android/app/build/outputs/apk/lite/debug/*.apk

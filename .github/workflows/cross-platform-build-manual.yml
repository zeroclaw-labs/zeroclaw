name: Cross-Platform Build

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Feature distribution to measure
        required: true
        type: choice
        default: dist
        options:
          - dist
          - dist-broad
      qualification_profile:
        description: Normal matrix or nonpublishing Stable GNU Ubuntu22 qualification
        required: true
        type: choice
        default: normal
        options:
          - normal
          - stable-gnu-ubuntu22
      release_tools_only:
        description: Skip release builds and run only the native release-tool smoke
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tool-smoke:
    name: Verify release tool / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux cross
            os: ubuntu-22.04
            tool: cross
          - name: Windows Tauri CLI
            os: windows-latest
            tool: tauri-cli
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate manual qualification inputs
        shell: bash
        env:
          QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
          DISTRIBUTION: ${{ inputs.distribution }}
          RELEASE_TOOLS_ONLY: ${{ inputs.release_tools_only }}
        run: |
          case "$QUALIFICATION_PROFILE" in
            normal|stable-gnu-ubuntu22) ;;
            *) echo "invalid qualification profile" >&2; exit 2 ;;
          esac
          case "$DISTRIBUTION" in
            dist|dist-broad) ;;
            *) echo "invalid distribution" >&2; exit 2 ;;
          esac
          case "$RELEASE_TOOLS_ONLY" in
            true|false) ;;
            *) echo "invalid release-tools-only value" >&2; exit 2 ;;
          esac
          if [ "$QUALIFICATION_PROFILE" = stable-gnu-ubuntu22 ] && {
            [ "$DISTRIBUTION" != dist ] || [ "$RELEASE_TOOLS_ONLY" != false ]
          }; then
            echo "Stable GNU qualification requires dist and release_tools_only=false" >&2
            exit 2
          fi
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0

      - name: Verify native runner and revision
        shell: bash
        run: |
          test "$RUNNER_ARCH" = "X64"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "### Release tool smoke / ${{ matrix.name }}"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Runner: \`$RUNNER_OS/$RUNNER_ARCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify current release archive baseline
        shell: bash
        run: bash scripts/ci/package_release_archive.test.sh

      - name: Resolve Cargo bin directory
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-${HOME}/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            cargo_home="$(cygpath -u "$cargo_home")"
          fi
          echo "RELEASE_TOOL_CARGO_BIN=${cargo_home}/bin" >> "$GITHUB_ENV"

      - name: Install pinned release tool
        shell: bash
        run: bash scripts/ci/install_release_tool.sh "${{ matrix.tool }}"

      - name: Verify cross installation
        if: matrix.tool == 'cross'
        shell: bash
        run: |
          expected_cross_path="${RELEASE_TOOL_CARGO_BIN}/cross"
          expected_cross_util_path="${RELEASE_TOOL_CARGO_BIN}/cross-util"
          cross_path="$(command -v cross)"
          cross_util_path="$(command -v cross-util)"
          test "$cross_path" = "$expected_cross_path"
          test "$cross_util_path" = "$expected_cross_util_path"
          test -x "$expected_cross_path"
          test -x "$expected_cross_util_path"
          cross_version="$(cross --version)"
          printf '%s\n' "$cross_version"
          {
            echo "- cross: \`$cross_path\`"
            echo "- cross-util: \`$cross_util_path\`"
            echo "- cross --version: \`$cross_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Tauri CLI installation
        if: matrix.tool == 'tauri-cli'
        shell: bash
        run: |
          expected_tauri_path="${RELEASE_TOOL_CARGO_BIN}/cargo-tauri.exe"
          tauri_path="$(command -v cargo-tauri.exe)"
          test "$tauri_path" = "$expected_tauri_path"
          test -x "$expected_tauri_path"
          direct_version="$(cargo-tauri.exe --version)"
          cargo_version="$(cargo tauri --version)"
          printf '%s\n%s\n' "$direct_version" "$cargo_version"
          {
            echo "- cargo-tauri.exe: \`$tauri_path\`"
            echo "- cargo-tauri.exe --version: \`$direct_version\`"
            echo "- cargo tauri --version: \`$cargo_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Build Web Dashboard
    if: ${{ inputs.qualification_profile == 'normal' && !inputs.release_tools_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web dashboard
        # `cargo web build` is the xtask wrapper that:
        # 1. renders the gateway's OpenAPI 3.1 spec in-process,
        # 2. runs `npx openapi-typescript` to produce
        #    `web/src/lib/api-generated.ts` (gitignored — never
        #    committed since #4f60f4405),
        # 3. runs `npm ci` + `npm run build` (tsc + vite).
        # Plain `cd web && npm run build` skips step 1+2 and tsc
        # fails on the missing import.
        run: cargo web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build:
    name: Build ${{ inputs.distribution }} / ${{ matrix.target }}
    needs: [web]
    if: ${{ inputs.qualification_profile == 'normal' && !inputs.release_tools_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin') && 180 || 90 }}
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Native Linux smoke-check build intentionally uses default linker.
            # CI gate (`ci.yml`) uses clang+mold for throughput optimization.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_compiler: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross_compiler: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker: arm-linux-gnueabihf-gcc
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            cross_compiler: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            linker_env: CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker: arm-linux-gnueabihf-gcc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-linux-android
            ndk: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.os != 'Windows'
        with:
          prefix-key: ${{ matrix.os }}-${{ matrix.target }}
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/

      - name: Install cross compiler
        if: matrix.cross_compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.cross_compiler }}

      - name: Install cross (MUSL targets)
        if: matrix.use_cross
        run: bash scripts/ci/install_release_tool.sh cross

      - name: Setup Android NDK
        if: matrix.ndk
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) NDK_HOST="linux-x86_64" ;;
            aarch64) NDK_HOST="linux-aarch64" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          NDK_PREBUILT="$ANDROID_NDK/toolchains/llvm/prebuilt/$NDK_HOST"
          if [ ! -d "$NDK_PREBUILT" ]; then
            echo "Android NDK prebuilt directory not found: $NDK_PREBUILT" >&2
            exit 1
          fi
          echo "$NDK_PREBUILT/bin" >> "$GITHUB_PATH"

      - name: Configure target environment
        shell: bash
        run: |
          dist_build_jobs=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            case "${{ matrix.target }}" in
              aarch64-unknown-linux-gnu|aarch64-unknown-linux-musl)
                dist_build_jobs=" --jobs 2"
                ;;
            esac
          fi
          {
            if [ "${{ matrix.use_cross || 'false' }}" = "true" ]; then
              echo "BUILD_CMD=cross build${dist_build_jobs}"
            else
              echo "BUILD_CMD=cargo build${dist_build_jobs}"
            fi
            if [ -n "${{ matrix.linker_env || '' }}" ] && [ -n "${{ matrix.linker || '' }}" ]; then
              echo "${{ matrix.linker_env }}=${{ matrix.linker }}"
            fi
            if [ "${{ matrix.target }}" = "arm-unknown-linux-gnueabihf" ]; then
              # Force ARMv6 codegen for arm-unknown-linux-gnueabihf (#4556).
              # Ubuntu's gcc-arm-linux-gnueabihf defaults to ARMv7+NEON,
              # which segfaults on ARMv6 devices (e.g., Raspberry Pi Zero W).
              echo "CFLAGS_arm_unknown_linux_gnueabihf=-march=armv6 -mfpu=vfp -mfloat-abi=hard"
              echo "CXXFLAGS_arm_unknown_linux_gnueabihf=-march=armv6 -mfpu=vfp -mfloat-abi=hard"
              echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS=-C target-feature=-neon"
            fi
          } >> "$GITHUB_ENV"

      - name: Prepare bounded Linux ARM64 build memory
        id: dist_memory
        timeout-minutes: 5
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-musl')
        shell: bash
        run: bash scripts/ci/dist_runner_memory.sh prepare

      - name: Build release
        shell: bash
        run: |
          FEATURES="$(cargo run --quiet -p xtask --bin generate -- features --selection "${{ inputs.distribution }}" --target "${{ matrix.target }}")"
          echo "Resolved features: $FEATURES"
          $BUILD_CMD --release --locked --no-default-features --features "${FEATURES}" --target ${{ matrix.target }}
          binary="target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}"
          bytes="$(wc -c < "$binary" | tr -d ' ')"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sha256="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
          else
            sha256="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          fi
          {
            echo "### ${{ inputs.distribution }} / ${{ matrix.target }}"
            echo
            echo "- Binary bytes: $bytes"
            echo "- Resolved features: \`$FEATURES\`"
            echo "- SHA-256: $sha256"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'RELEASE_ARCHIVE_FEATURES=%s\n' "$FEATURES" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeroclaw-manual-${{ inputs.distribution }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}
          if-no-files-found: error
          retention-days: 1
      - name: Build ZeroCode companion
        if: matrix.target != 'aarch64-linux-android'
        shell: bash
        run: $BUILD_CMD --release --locked -p zerocode --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target != 'aarch64-linux-android'
        with:
          name: zerocode-manual-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zerocode.exe' || 'zerocode' }}
          if-no-files-found: error
          retention-days: 1
      - name: Build ZeroRelay companion
        if: matrix.target != 'aarch64-linux-android'
        shell: bash
        run: $BUILD_CMD --release --locked -p zerorelay --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target != 'aarch64-linux-android'
        with:
          name: zerorelay-manual-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zerorelay.exe' || 'zerorelay' }}
          if-no-files-found: error
          retention-days: 1

      - name: Check standard main binary size
        if: inputs.distribution == 'dist'
        shell: bash
        env:
          BINARY_SIZE_HARD_LIMIT: "83886080"
        run: bash scripts/ci/check_binary_size.sh "target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}" "${{ matrix.target }}"

      - name: Package and verify standard release archive
        if: inputs.distribution == 'dist'
        shell: bash
        run: |
          set -euo pipefail
          archive_python=""
          for candidate in python3 python; do
            if command -v "$candidate" >/dev/null 2>&1 \
              && "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 8))' 2>/dev/null; then
              archive_python="$candidate"
              break
            fi
          done
          test -n "$archive_python"
          target="${{ matrix.target }}"
          main="${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}"
          ext="${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}"
          suffix="${{ runner.os == 'Windows' && '.exe' || '' }}"
          companions=()
          if [ "$target" != aarch64-linux-android ]; then
            companions=(--companion "target/$target/release/zerocode$suffix"
              --companion "target/$target/release/zerorelay$suffix")
          fi
          "$archive_python" scripts/ci/verify_release_archive.py manifest \
            --binary "target/$target/release/$main" "${companions[@]}" \
            --web-dist web/dist --source "$GITHUB_SHA" --target "$target" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --features "$RELEASE_ARCHIVE_FEATURES" --output archive-evidence/input-manifest.json
          bash scripts/ci/package_release_archive.sh "$target" "$main" "$ext" "$RUNNER_OS"
          extract_dir="$(mktemp -d "$RUNNER_TEMP/zeroclaw-archive-check.XXXXXX")"
          trap 'rm -rf -- "$extract_dir"' EXIT
          "$archive_python" scripts/ci/verify_release_archive.py verify \
            --archive "zeroclaw-$target.$ext" --manifest archive-evidence/input-manifest.json \
            --extract-dir "$extract_dir" --expected-source "$GITHUB_SHA" --expected-target "$target" \
            --expected-run "$GITHUB_RUN_ID" --expected-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence archive-evidence/validation.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.distribution == 'dist'
        with:
          name: zeroclaw-manual-archive-dist-${{ matrix.target }}
          path: |
            zeroclaw-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
            archive-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Report and release owned Linux ARM64 build memory
        timeout-minutes: 5
        if: always() && runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-musl')
        shell: bash
        env:
          ZC_DIST_SWAP_FILE: ${{ steps.dist_memory.outputs.swap_file }}
          ZC_DIST_SWAP_IDENTITY: ${{ steps.dist_memory.outputs.swap_identity }}
        run: bash scripts/ci/dist_runner_memory.sh cleanup

  # Rehearsal of the release's plugin smoke: the same packages and the same
  # script run against the binary each build leg uploaded, on a runner that
  # executes that target natively, so a distribution change is measured and
  # proven from one dispatch.
  plugin-smoke-packages:
    name: Build Plugin Smoke Packages
    if: ${{ inputs.qualification_profile == 'normal' && !inputs.release_tools_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: plugin-smoke-packages
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build plugin smoke packages
        run: bash scripts/ci/build_plugin_smoke_packages.sh "$RUNNER_TEMP/plugin-smoke-packages"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-smoke-packages
          path: ${{ runner.temp }}/plugin-smoke-packages
          if-no-files-found: error
          retention-days: 7

  # The build matrix has legs without a smoke leg (ARM32, Android), so the
  # rehearsal does not depend on every build leg succeeding: a leg whose
  # binary is missing fails on its own download instead.
  plugin-smoke:
    name: Plugin Smoke ${{ inputs.distribution }} / ${{ matrix.target }}
    needs: [build, plugin-smoke-packages]
    if: ${{ !cancelled() && inputs.qualification_profile == 'normal' && !inputs.release_tools_only && needs.plugin-smoke-packages.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        # The same legs as the stable release; an xtask test keeps both lists
        # equal to the registry's per-target plugin policy.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.distribution != 'dist'
        with:
          name: zeroclaw-manual-${{ inputs.distribution }}-${{ matrix.target }}
          path: binary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.distribution == 'dist'
        with:
          name: zeroclaw-manual-archive-dist-${{ matrix.target }}
          path: archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-smoke-packages
          path: plugin-smoke-packages
      - name: Verify and extract standard release archive
        if: inputs.distribution == 'dist'
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive_python=""
          for candidate in python3 python; do
            if command -v "$candidate" >/dev/null 2>&1 \
              && "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 8))' 2>/dev/null; then
              archive_python="$candidate"
              break
            fi
          done
          test -n "$archive_python"
          target="${{ matrix.target }}"
          main="${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}"
          ext="${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}"
          extract_dir="$(mktemp -d "$RUNNER_TEMP/zeroclaw-archive-smoke.XXXXXX")"
          "$archive_python" scripts/ci/verify_release_archive.py verify \
            --archive "archive/zeroclaw-$target.$ext" --manifest archive/archive-evidence/input-manifest.json \
            --extract-dir "$extract_dir" --expected-source "$GITHUB_SHA" --expected-target "$target" \
            --expected-run "$GITHUB_RUN_ID" --expected-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence "archive-validation-$target.json"
          printf 'binary=%s\n' "$extract_dir/$main" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "archive/zeroclaw-$target.$ext" >> "$GITHUB_OUTPUT"
      - name: Run scripted provider tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          provider_python=""
          for candidate in python3 python; do
            if command -v "$candidate" >/dev/null 2>&1 \
              && "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 8))' 2>/dev/null; then
              provider_python="$candidate"
              break
            fi
          done
          if [ -z "$provider_python" ]; then
            echo "python 3.8 or newer is required" >&2
            exit 1
          fi
          "$provider_python" scripts/ci/plugin_smoke_provider_test.py -v

      - name: Run the plugin smoke against the built binary
        shell: bash
        env:
          SMOKE_DISTRIBUTION: ${{ inputs.distribution }}
          SMOKE_BINARY: ${{ steps.archive.outputs.binary }}
          SMOKE_ARCHIVE: ${{ steps.archive.outputs.archive }}
          SMOKE_BINARY_NAME: ${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}
          SMOKE_LABEL: ${{ inputs.distribution }} / ${{ matrix.target }}
          SMOKE_EVIDENCE: plugin-smoke-${{ matrix.target }}.md
        run: |
          set -euo pipefail
          if [ "$SMOKE_DISTRIBUTION" = dist ]; then
            binary="$SMOKE_BINARY"
          else
            binary="binary/$SMOKE_BINARY_NAME"
          fi
          chmod +x "$binary"
          archive_args=()
          if [ "$SMOKE_DISTRIBUTION" = dist ]; then
            archive_args=(--archive "$SMOKE_ARCHIVE")
          fi
          bash scripts/ci/plugin_artifact_smoke.sh \
            --binary "$binary" \
            --expect host \
            --packages plugin-smoke-packages \
            --label "$SMOKE_LABEL" \
            ${archive_args[@]+"${archive_args[@]}"} \
            --evidence "$SMOKE_EVIDENCE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: plugin-smoke-${{ inputs.distribution }}-${{ matrix.target }}
          path: |
            plugin-smoke-${{ matrix.target }}.md
            archive-validation-${{ matrix.target }}.json
          if-no-files-found: ignore
          retention-days: 7

  stable-gnu-web:
    name: Stable GNU Ubuntu22 / Web
    needs: [release-tool-smoke]
    if: ${{ inputs.qualification_profile == 'stable-gnu-ubuntu22' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: cache
        with:
          shared-key: web
          save-if: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web dashboard
        run: cargo web build
      - name: Record same-run web inputs
        shell: bash
        env:
          QUALIFICATION_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          assert os.environ["CARGO_INCREMENTAL"] == "0"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["GITHUB_SHA"]
          root = pathlib.Path("web/dist")
          files = {}
          for path in sorted(root.rglob("*")):
              assert not path.is_symlink()
              if path.is_file():
                  files[path.relative_to(root).as_posix()] = {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          assert files
          binding = {"source": os.environ["GITHUB_SHA"], "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(), "run": int(os.environ["GITHUB_RUN_ID"]), "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "profile": "stable-gnu-ubuntu22"}
          receipt = {"binding": binding, "role": "web", "files": files, "cache": {"shared_key": "web", "save_if": False, "hit": os.environ["QUALIFICATION_CACHE_HIT"], "cargo_incremental": os.environ["CARGO_INCREMENTAL"]}}
          pathlib.Path("qualification-web.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-gnu-ubuntu22-web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-gnu-ubuntu22-web-receipt
          path: qualification-web.json
          if-no-files-found: error
          retention-days: 7

  stable-gnu-plugin-smoke-packages:
    name: Stable GNU Ubuntu22 / Plugin Smoke Packages
    needs: [release-tool-smoke]
    if: ${{ inputs.qualification_profile == 'stable-gnu-ubuntu22' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

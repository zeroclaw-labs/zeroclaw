name: Scheduled Platform Tests

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/platform-tests.yml"
      - "crates/zeroclaw-tools/src/coding_cli.rs"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  platform-tests:
    name: Platform Test (${{ matrix.name }})
    needs: [fmt]
    # macOS is a supported target ahead of Windows and has passed 20/20 recent
    # runs, so its result is honest and a regression turns this workflow red.
    # Windows stays masked ONLY because one known test is red -- see
    # cron::scheduler::tests::agent_cron_run_keeps_workspace_through_shell_on_retry_and_concurrency,
    # where the cron shell reports a POSIX path (/tmp/...) instead of the
    # Windows scheduler workspace. Re-enable by deleting this expression once
    # that test is fixed; do not widen it to hide new failures.
    continue-on-error: ${{ matrix.name == 'Windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            nextest-platform: mac
            timeout-minutes: 45
          - name: Windows
            os: windows-latest
            nextest-platform: windows-tar
            timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Ensure web/dist placeholder exists
        shell: bash
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf "https://get.nexte.st/latest/${{ matrix.nextest-platform }}" | tar zxf - -C "$HOME/.cargo/bin"
      - name: Run tests
        shell: bash
        run: cargo nextest run --locked --workspace --exclude zeroclaw-desktop --no-fail-fast

name: Build discovery runtime artifact

on:
  push:
    branches: [feat/agent-discovery-20261029]
  workflow_dispatch:

permissions:
  contents: read

# Deployment checks belong to the consuming Forgejo PRs. This fork-only
# publisher packages the locally tested source for PR #12098; retire when
# an official runtime includes discovery and passes production acceptance.
jobs:
  publish:
    if: github.repository == 'cwahn/zeroclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        id: image
        with:
          context: .
          file: Containerfile
          target: package-fat
          platforms: linux/amd64
          push: true
          provenance: mode=max
          build-args: ZEROCLAW_BUILD_ID=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/cwahn/zeroclaw
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/cwahn/zeroclaw:sha-${{ github.sha }}
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
      - name: Sign and report immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/cwahn/zeroclaw@${DIGEST}"
          echo "ghcr.io/cwahn/zeroclaw@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

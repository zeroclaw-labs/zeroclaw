                  result = {"schema": 1, "kind": "EXACT_EIGHT_TERMINAL_RESULTS", "exit_class": "NONZERO",
                            "results": [{"name": name, "status": by_name[name]} for name in names], "counts": dict(counts)}
                  check(len((json.dumps(result, sort_keys=True) + "\n").encode()) <= 4096)
                  return result
              except Exception:
                  return None

          def bounded_failure_object(minimum, diagnostic):
              # This pure composition is used in the separate finalizer and synthetic tests.
              if diagnostic is not None:
                  candidate = {**minimum, "diagnostic": diagnostic}
                  if len((json.dumps(candidate, sort_keys=True) + "\n").encode()) <= 4096:
                      return candidate
              return minimum
          def optional_named_failure(read_receipt, expected_binding, states, run_argv, list_argv):
              # Only fixed typed receipts; read_receipt cannot be used for raw captures.
              try:
                  def unique(items):
                      value = {}
                      for key, item in items:
                          if key in value:
                              raise ValueError("E_JSON_DUPLICATE")
                          value[key] = item
                      return value
                  def typed(name, cap):
                      data = read_receipt(name, cap)
                      if type(data) is not bytes or len(data) > cap:
                          raise ValueError("E_FILE_CAP")
                      return json.loads(data.decode("utf-8"), object_pairs_hook=unique)
                  phase = typed("test-commands.json", 65536)
                  if (type(phase) is not dict or set(phase) != {"binding", "commands", "named_failure_committed"}
                          or phase["binding"] != expected_binding or phase["named_failure_committed"] is not True):
                      return None
                  return validated_named_failure(
                      typed("named-failure-decision.json", 16384), phase,
                      typed("source.json", 65536), typed("selection.json", 65536),
                      typed("platform.json", 65536), expected_binding, states, run_argv, list_argv)
              except Exception:
                  return None

          run, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          assert re.fullmatch(r"[1-9][0-9]{0,19}", run) and re.fullmatch(r"[1-9][0-9]{0,19}", attempt)
          r = Path(os.environ["RUNNER_TEMP"]) / ("pr11364-eight-" + run + "-" + attempt)
          try:
              sys.argv = [str(r / "harness.py"), "verify"]
              runpy.run_path(str(r / "harness.py"), run_name="__main__")
          except BaseException:
              # No refused output, exception text, keys, config, env, paths or
              # screenshots enter this independent fixed-schema failure receipt.
              head = os.environ["PROOF_HEAD"]
              assert re.fullmatch(r"[0-9a-f]{40}", head)
              safe = r / "failure"; safe.mkdir(parents=True)
              value = {"schema": 1, "repository": "zeroclaw-labs/zeroclaw", "pr": 11364,
                       "head": head, "run_id": run, "attempt": attempt,
                       "code": "E_QUALIFICATION_INCOMPLETE", "eight_pass_verified": False}
              keys = ["PREPARE_OUTCOME", "TOOLCHAIN_OUTCOME", "CACHE_OUTCOME", "SETUP_OUTCOME", "LIST_OUTCOME", "TEST_OUTCOME"]
              states = {key: os.environ[key] for key in keys}
              assert all(x in ["success", "failure", "skipped", "cancelled", ""] for x in states.values())
              value["step_outcomes"] = states
              # Read only fixed typed receipts; never raw captures or prefixes.
              def typed_receipt_bytes(name, cap):
                  path = r / "private" / name
                  if not path.is_file() or path.is_symlink():
                      raise ValueError("E_FILE_TYPE")
                  with path.open("rb") as stream:
                      data = stream.read(cap + 1)
                  if len(data) > cap:
                      raise ValueError("E_FILE_CAP")
                  return data
              diagnostic = None
              try:
                  if (os.environ["GITHUB_EVENT_NAME"] == "pull_request"
                          and os.environ["PROOF_REPO"] == "zeroclaw-labs/zeroclaw"
                          and os.environ["PROOF_NUMBER"] == "11364"
                          and os.environ["PROOF_TOPIC"] == "test/hardware-windows-fake-arduino-cli"
                          and not any(os.environ.get(key) for key in ["NEXTEST_PROFILE", "NEXTEST_TEST_THREADS", "CARGO_BUILD_JOBS"])):
                      expected_binding = {key: os.environ["PROOF_" + key.upper()]
                                          for key in ["head", "base", "merge", "workflow"]}
                      expected_binding.update(repository="zeroclaw-labs/zeroclaw", pr=11364, run_id=run, attempt=attempt)
                      common = ["--locked", "-p", "zeroclaw-hardware", "--features", "hardware",
                                "--lib", "-E", "test(/^peripherals::arduino_upload::tests::/)"]
                      expected_run = ["cargo", "nextest", "run", *common, "--no-fail-fast", "--no-tests",
                                      "fail", "--retries", "0", "--status-level", "pass",
                                      "--final-status-level", "fail", "--color", "never",
                                      "--failure-output", "never", "--success-output", "never"]
                      expected_list = ["cargo", "nextest", "list", *common, "--message-format", "json"]
                      diagnostic = optional_named_failure(typed_receipt_bytes, expected_binding, states, expected_run, expected_list)
              except Exception:
                  pass
              value = bounded_failure_object(value, diagnostic)
              data = (json.dumps(value, sort_keys=True) + "\n").encode()
              assert len(data) <= 4096
              with (safe / "failure.json").open("xb") as f:
                  f.write(data)
              with (r / "failure-decision.json").open("x") as f:
                  json.dump({"head": head, "run_id": run, "attempt": attempt, "safe_export": True}, f)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("failure_export=true\n")
              raise SystemExit(1)

      - name: Upload validated eight-test evidence
        if: ${{ success() && !cancelled() && steps.verify.outputs.success_export == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr11364-eight-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/source.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/platform.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/selection.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/outcome.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/commands.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/test.log
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/decision.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload minimum safe failure evidence
        if: ${{ always() && !cancelled() && steps.verify.outputs.failure_export == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr11364-eight-failure-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/failure/failure.json
          if-no-files-found: error
          retention-days: 1

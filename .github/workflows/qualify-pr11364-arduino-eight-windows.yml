              require(re.fullmatch(r"cargo 1\.98\.0 \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\)", value["cargo"]), "E_COMPILER_SCHEMA")
              require(re.fullmatch(r"cargo-nextest 0\.9\.143(?: \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\))?", value["nextest"]), "E_NEXTEST_SCHEMA")

              require(value["runner_label"] == "windows-latest", "E_PLATFORM_SCHEMA")
              require(set(value["image"]) == {"ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH"}, "E_PLATFORM_SCHEMA")
              require(all(re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", x) for x in value["image"].values()), "E_PLATFORM_SCHEMA")

              paths = [ARDUINO, "Cargo.lock", "Cargo.toml", "crates/zeroclaw-hardware/Cargo.toml", WORKFLOW]
              hashes = {path: digest(read(Path(path), 1048576)) for path in paths}
              require(hashes[ARDUINO] == "56d246bdd3103249d6b8b7eba9294e40ebd025e3d716d3b8eb8424d9435323dc", "E_ARDUINO_BYTES")
              require(hashes["Cargo.lock"] == "4294db86b3307b07bfb67f1c10b3bd686069c6b2b2dbfae39af54c58846410ad", "E_LOCK")
              require(hashes["Cargo.toml"] == "4c955ec6672a3a255f4962a21c821e468e89424cd9b4937660f0f40a898745ba", "E_MANIFEST")
              require(hashes["crates/zeroclaw-hardware/Cargo.toml"] == "7f8d1fd77e33cff1deb4b2fc81d8e8eec485bf0d78b1a36ef7dfba09b5fcf466", "E_MANIFEST")

name: PR11364 Arduino eight Windows proof

# Temporary head-source evidence lane. Ordinary Quality Gate and the existing
# ci:windows advisory still run independently; this is not the entire PR workload.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - crates/zeroclaw-hardware/src/peripherals/arduino_upload.rs
      - .github/workflows/qualify-pr11364-arduino-eight-windows.yml

permissions:
  contents: read

jobs:
  arduino-eight-windows:
    name: PR11364 exact Arduino eight / Windows
    if: >-
      github.event.pull_request.number == 11364 &&
      github.event.pull_request.head.repo.full_name == 'zeroclaw-labs/zeroclaw' &&
      github.event.pull_request.head.ref == 'test/hardware-windows-fake-arduino-cli' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: false
    env:
      PROOF_HEAD: ${{ github.event.pull_request.head.sha }}
      PROOF_BASE: ${{ github.event.pull_request.base.sha }}
      PROOF_MERGE: ${{ github.sha }}
      PROOF_WORKFLOW: ${{ github.workflow_sha }}
      PROOF_REPO: ${{ github.repository }}
      PROOF_TOPIC: ${{ github.event.pull_request.head.ref }}
      PROOF_NUMBER: ${{ github.event.pull_request.number }}
      PROOF_EXPECTED: >-
        ["peripherals::arduino_upload::tests::fake_cli_success_runs_all_stages_and_cleans_workspace",
        "peripherals::arduino_upload::tests::compile_failure_reports_stderr_and_cleans_workspace",
        "peripherals::arduino_upload::tests::failed_preflight_does_not_compile_or_upload",
        "peripherals::arduino_upload::tests::non_not_found_spawn_error_keeps_its_cause",
        "peripherals::arduino_upload::tests::compile_timeout_kills_reaps_and_cleans_workspace",
        "peripherals::arduino_upload::tests::preflight_timeout_reports_its_stage",
        "peripherals::arduino_upload::tests::upload_timeout_reports_its_stage_and_cleans_workspace",
        "peripherals::arduino_upload::tests::upload_failure_reports_stderr_and_cleans_workspace"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind head source and install the inline evidence harness
        id: prepare
        timeout-minutes: 2
        shell: python {0}
        run: |
          # Only this workflow is tracked. The identical script is retained in
          # runner temp for later phases; it never enters the source checkout.
          import ctypes as c
          from ctypes import wintypes as w
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import subprocess
          import sys
          import tarfile
          import time
          import urllib.request

          ANCESTOR = "6b98ff79ba9c7a0b3246e1c2398626f8a652c25e"
          EXPECTED_PARENT = "de4e14f4ca752b34804911e293d018095969d76f"
          WORKFLOW = ".github/workflows/qualify-pr11364-arduino-eight-windows.yml"
          ARDUINO = "crates/zeroclaw-hardware/src/peripherals/arduino_upload.rs"
          MODULE = "peripherals::arduino_upload::tests::"
          EXPECTED = json.loads(os.environ["PROOF_EXPECTED"])
          BODY_HASHES = [
              "62b62dfa8bc12e71ec3b3b619a4345e4eeea4a42f15cf5d7845efffde66cc617",
              "db0ac02938f9a8c42bf8c43ffad607a7d39ee5e12a1598dc89e97b0625e8d919",
              "00e027eb758c1a368438d7bfdf3caccc49e2f8d7563e9e0e4897c9e0fcbf8d01",
              "bc5b7e764405431f8716836e30b8656ce61675b87ec9ae46db4b9d58de7d9bae",
              "19bdda3fd1d53f31dc640225cbc93c9ff5a20526f48bf217b0266488dfb2d6d3",
              "95d3424e1e34de1698ae1e4e6c4012c9f0bfed861323793d521356e6cadd8440",
              "9a606dc331ea2dcc999d80b83cab543f6b89136b58521dd6f46558c628d5bdb5",
              "304b88c801345474c8d39e4f01cf8ea9b4d511078db855d1b8c9747250185b3e",
          ]
          COMMON = ["--locked", "-p", "zeroclaw-hardware", "--features", "hardware",
                    "--lib", "-E", "test(/^peripherals::arduino_upload::tests::/)"]
          LIST = ["cargo", "nextest", "list", *COMMON, "--message-format", "json"]
          RUN = ["cargo", "nextest", "run", *COMMON, "--no-fail-fast", "--no-tests",
                 "fail", "--retries", "0", "--status-level", "pass",
                 "--final-status-level", "fail", "--color", "never",
                 "--failure-output", "never", "--success-output", "never"]
          SHA = re.compile(r"[0-9a-f]{40}")
          HEX = re.compile(r"[0-9a-f]{64}")
          COMMANDS = []
          DEADLINE = time.monotonic() + 100

          class Refusal(Exception):
              pass

          def require(ok, code):
              if not ok:
                  raise Refusal(code)

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def read(path, cap):
              require(path.is_file() and not path.is_symlink(), "E_FILE_TYPE")
              with path.open("rb") as f:
                  data = f.read(cap + 1)
              require(len(data) <= cap, "E_FILE_CAP")
              return data

          def pairs(items):
              result = {}
              for key, value in items:
                  require(key not in result, "E_JSON_DUPLICATE")
                  result[key] = value
              return result

          def load(path, cap=65536):
              return json.loads(read(path, cap).decode("utf-8"), object_pairs_hook=pairs)

          def put(path, value):
              data = (json.dumps(value, sort_keys=True, indent=2) + "\n").encode()
              require(len(data) <= 65536, "E_RECEIPT_CAP")
              with path.open("xb") as f:
                  f.write(data)

          # Pure, finite failure diagnostics. No raw-file reads or native calls.
          DIAGNOSTIC_NAMES = (
              "peripherals::arduino_upload::tests::fake_cli_success_runs_all_stages_and_cleans_workspace",
              "peripherals::arduino_upload::tests::compile_failure_reports_stderr_and_cleans_workspace",
              "peripherals::arduino_upload::tests::failed_preflight_does_not_compile_or_upload",
              "peripherals::arduino_upload::tests::non_not_found_spawn_error_keeps_its_cause",
              "peripherals::arduino_upload::tests::compile_timeout_kills_reaps_and_cleans_workspace",
              "peripherals::arduino_upload::tests::preflight_timeout_reports_its_stage",
              "peripherals::arduino_upload::tests::upload_timeout_reports_its_stage_and_cleans_workspace",
              "peripherals::arduino_upload::tests::upload_failure_reports_stderr_and_cleans_workspace",
          )

          def diagnostic_context(src, selected, platform_data):
              return (
                  tuple(src["binding"][key] for key in
                        ("head", "base", "merge", "workflow", "repository", "pr", "run_id", "attempt")),
                  (src["tree"], EXPECTED_PARENT, src["arduino_blob"]),
                  DIAGNOSTIC_NAMES, selected["excluded_before_run"],
                  (selected["executable"]["sha256"], selected["executable"]["bytes"],
                   platform_data["nextest_executable_sha256"]),
              )

          def project_named_failure(accepted, rc_value, context):
              try:
                  if (type(accepted) is not tuple or len(accepted) != 2
                          or any(type(x) is not bytes for x in accepted)
                          or accepted[0] or not 0 < len(accepted[1]) <= 2097152
                          or type(rc_value) is not int or not 0 < rc_value <= 4294967295):
                      return None
                  bt, st, names, excluded, executable = context
                  keys = ("head", "base", "merge", "workflow", "repository", "pr", "run_id", "attempt")
                  b = dict(zip(keys, bt))
                  if (type(context) is not tuple or len(context) != 5 or len(bt) != 8
                          or names != DIAGNOSTIC_NAMES or type(excluded) is not int
                          or not 0 <= excluded <= 2097152 or len(st) != 3 or len(executable) != 3
                          or any(type(b[k]) is not str or not SHA.fullmatch(b[k]) for k in keys[:4])
                          or b["repository"] != "zeroclaw-labs/zeroclaw" or type(b["pr"]) is not int or b["pr"] != 11364
                          or any(type(b[k]) is not str or not re.fullmatch(r"[1-9][0-9]{0,19}", b[k]) for k in keys[-2:])
                          or not SHA.fullmatch(st[0]) or st[1] != EXPECTED_PARENT
                          or st[2] != "028627cb1907b9aace3cec9f6bb9a9e7200702cb"
                          or not HEX.fullmatch(executable[0]) or not HEX.fullmatch(executable[2])
                          or type(executable[1]) is not int or not 0 < executable[1] <= 268435456):
                      return None
                  text = accepted[1].decode("utf-8")
                  if not text.endswith("\n") or any(x in text for x in ["\x00", "\x1b", "\ufeff"]):
                      return None
                  text = text.replace("\r\n", "\n")
                  if any(ord(x) < 32 and x != "\n" for x in text):
                      return None
                  lines = [x.strip(" ") for x in text.split("\n") if x.strip(" ")]
                  i = 0
                  duration = r"[0-9]{1,3}\.[0-9]{3}"
                  finished = re.fullmatch(r"Finished `test` profile \[unoptimized \+ debuginfo\] target\(s\) in ([0-9]{1,3}\.[0-9]{2})s", lines[i])
                  if finished:
                      if float(finished[1]) > 300:
                          return None
                      i += 1
                  bar = lines[i]; i += 1
                  if bar not in ["------------", "────────────"]:
                      return None
                  banner = re.fullmatch(r"Nextest run ID ([0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}) with nextest profile: default", lines[i])
                  i += 1
                  suffix = "" if excluded == 0 else " (" + str(excluded) + (" test" if excluded == 1 else " tests") + " skipped)"
                  if banner is None or lines[i] != "Starting 8 tests across 1 binary" + suffix:
                      return None
                  i += 1
                  terminal, ordinals, seen, slow = [], set(), set(), {}
                  pattern = r"(PASS|FAIL|TIMEOUT|XFAIL) \[ *(" + duration + r")s\] \( *([1-8])/8\) zeroclaw-hardware ([a-z_:]+)"
                  while len(terminal) < 8:
                      line = lines[i]; i += 1
                      m = re.fullmatch(pattern, line)
                      if m:
                          status, elapsed, ordinal, name = m.groups()
                          if name not in names or name in seen or int(ordinal) in ordinals or float(elapsed) > 300:
                              return None
                          seen.add(name); ordinals.add(int(ordinal))
                          terminal.append((int(ordinal), name, status, elapsed))
                          continue
                      progress = re.fullmatch(r"(SLOW|TERMINATING) \[> *(" + duration + r")s\] \((?:---|───)\) zeroclaw-hardware ([a-z_:]+)", line)
                      if progress:
                          _, elapsed, name = progress.groups()
                          value = float(elapsed)
                          if name not in names or name in seen or value > 300 or value < slow.get(name, 0):
                              return None
                          slow[name] = value
                          continue
                      return None
                  if seen != set(names) or ordinals != set(range(1, 9)) or lines[i] != bar:
                      return None
                  i += 1
                  histogram = {status: sum(row[2] == status for row in terminal) for status in ["PASS", "FAIL", "TIMEOUT", "XFAIL"]}
                  if histogram["PASS"] == 8:
                      return None
                  summary = str(histogram["PASS"]) + " passed, "
                  for status, label in [("FAIL", "failed"), ("XFAIL", "exec failed"), ("TIMEOUT", "timed out")]:
                      if histogram[status]:
                          summary += str(histogram[status]) + " " + label + ", "
                  summary += str(excluded) + " skipped"
                  m = re.fullmatch(r"Summary \[ *(" + duration + r")s\] 8 tests run: " + re.escape(summary), lines[i])
                  i += 1
                  if m is None or float(m[1]) > 300:
                      return None
                  echoes = []
                  for row in sorted((x for x in terminal if x[2] != "PASS"), key=lambda x: x[0]):
                      m = re.fullmatch(pattern, lines[i]); i += 1
                      if m is None or (int(m[3]), m[4], m[1], m[2]) != row:
                          return None
                      echoes.append(row[0])
                  if lines[i:] != ["error: test run failed"]:
                      return None
                  return {
                      "schema": 1, "kind": "EXACT_RUN_COMPLETE_NAMED_FAILURE", "binding": b,
                      "association": {"source_tree": st[0], "expected_parent": st[1], "arduino_blob": st[2],
                                      "selected_executable_sha256": executable[0], "selected_executable_bytes": executable[1],
                                      "nextest_executable_sha256": executable[2]},
                      "selection": {"selected": list(names), "selected_ignored": 0,
                                    "binary_id": "zeroclaw-hardware", "excluded_before_run": excluded},
                      "capture": {k: True for k in ["complete", "closed_owned_job_and_pipes", "cleanup_validated", "stdout_empty", "exact_RUN"]},
                      "reporter": {"version": "0.9.143", "profile": "default", "status_level": "pass", "final_status_level": "fail",
                                   "failure_output": "never", "success_output": "never", "retries": 0,
                                   "nextest_run_id": banner[1], "summary_complete": True, "final_echoes_complete": True, "footer": "TEST_RUN_FAILED"},
                      "exit_class": "NONZERO",
                      "terminal": [{"ordinal": x[0], "name": x[1], "status": x[2]} for x in terminal],
                      "final_echo_ordinals": echoes,
                      "counts": {"run": 8, "passed": histogram["PASS"], "failed": histogram["FAIL"],
                                 "timed_out": histogram["TIMEOUT"], "exec_failed": histogram["XFAIL"],
                                 "selected_skipped": 0, "excluded_before_run": excluded},
                  }
              except Exception:
                  return None

          def maybe_write_named_failure(accepted, rc_value, context, open_decision):
              try:
                  decision = project_named_failure(accepted, rc_value, context)
                  if decision is None:
                      return False
                  data = (json.dumps(decision, sort_keys=True) + "\n").encode()
                  if len(data) > 16384:
                      return False
                  with open_decision() as stream:
                      if stream.write(data) != len(data):
                          return False
                      stream.flush()
                  # Only True return: full write, flush AND close returned.
                  return True
              except Exception:
                  return False

          def commit_named_failure(accepted, rc_value, context, state, open_decision):
              committed = False
              try:
                  committed = maybe_write_named_failure(accepted, rc_value, context, open_decision)
              except Exception:
                  pass
              state["named_failure_committed"] = (committed is True)

          def phase_receipt_payload(phase, current_binding, commands, state):
              value = {"binding": current_binding, "commands": commands}
              if phase == "test":
                  require(type(state) is dict and set(state) == {"named_failure_committed"}
                          and type(state["named_failure_committed"]) is bool, "E_COMMAND_SCHEMA")
                  value["named_failure_committed"] = state["named_failure_committed"]
              return value

          def public_command_phase(value, phase, current_binding, allowed):
              keys = {"binding", "commands", "named_failure_committed"} if phase == "test" else {"binding", "commands"}
              require(set(value) == keys and value["binding"] == current_binding
                      and type(value["commands"]) is list and len(value["commands"]) <= 64, "E_COMMAND_SCHEMA")
              if phase == "test":
                  require(type(value["named_failure_committed"]) is bool
                          and value["named_failure_committed"] is False, "E_COMMAND_SCHEMA")
              for row in value["commands"]:
                  require(set(row) == {"argv", "exit", "elapsed_seconds", "stdout_bytes", "stderr_bytes", "stdout_sha256", "stderr_sha256", "owned_job_empty"} and row["argv"] in allowed and type(row["exit"]) is int and row["exit"] == 0 and row["owned_job_empty"] is True, "E_COMMAND_SCHEMA")
                  require(type(row["elapsed_seconds"]) in [int, float] and 0 <= row["elapsed_seconds"] <= 2705 and all(type(row[x]) is int and 0 <= row[x] <= 16777216 for x in ["stdout_bytes", "stderr_bytes"]) and all(HEX.fullmatch(row[x]) for x in ["stdout_sha256", "stderr_sha256"]), "E_COMMAND_SCHEMA")
              return {"binding": value["binding"], "commands": value["commands"]}

          def validated_named_failure(decision, phase, src, selected, platform_data, expected_binding, states, run_argv, list_argv):
              # Defined independently in the finalizer; Prepare has identical bytes for
              # isolated synthetic tests. No harness import, command or raw capture read.
              try:
                  def check(ok):
                      if not ok:
                          raise ValueError("E_NAMED_DIAGNOSTIC")
                  def obj(value, keys):
                      check(type(value) is dict and set(value) == set(keys))
                  def integer(value, low, high):
                      check(type(value) is int and low <= value <= high)
                  def sha(value, length):
                      check(type(value) is str and re.fullmatch(r"[0-9a-f]{" + str(length) + "}", value) is not None)
                  names = (
                      "peripherals::arduino_upload::tests::fake_cli_success_runs_all_stages_and_cleans_workspace",
                      "peripherals::arduino_upload::tests::compile_failure_reports_stderr_and_cleans_workspace",
                      "peripherals::arduino_upload::tests::failed_preflight_does_not_compile_or_upload",
                      "peripherals::arduino_upload::tests::non_not_found_spawn_error_keeps_its_cause",
                      "peripherals::arduino_upload::tests::compile_timeout_kills_reaps_and_cleans_workspace",
                      "peripherals::arduino_upload::tests::preflight_timeout_reports_its_stage",
                      "peripherals::arduino_upload::tests::upload_timeout_reports_its_stage_and_cleans_workspace",
                      "peripherals::arduino_upload::tests::upload_failure_reports_stderr_and_cleans_workspace",
                  )
                  body_hashes = (
                      "62b62dfa8bc12e71ec3b3b619a4345e4eeea4a42f15cf5d7845efffde66cc617",
                      "db0ac02938f9a8c42bf8c43ffad607a7d39ee5e12a1598dc89e97b0625e8d919",
                      "00e027eb758c1a368438d7bfdf3caccc49e2f8d7563e9e0e4897c9e0fcbf8d01",
                      "bc5b7e764405431f8716836e30b8656ce61675b87ec9ae46db4b9d58de7d9bae",
                      "19bdda3fd1d53f31dc640225cbc93c9ff5a20526f48bf217b0266488dfb2d6d3",
                      "95d3424e1e34de1698ae1e4e6c4012c9f0bfed861323793d521356e6cadd8440",
                      "9a606dc331ea2dcc999d80b83cab543f6b89136b58521dd6f46558c628d5bdb5",
                      "304b88c801345474c8d39e4f01cf8ea9b4d511078db855d1b8c9747250185b3e",
                  )
                  parent = "de4e14f4ca752b34804911e293d018095969d76f"
                  arduino = "crates/zeroclaw-hardware/src/peripherals/arduino_upload.rs"
                  workflow = ".github/workflows/qualify-pr11364-arduino-eight-windows.yml"
                  binding_keys = ["head", "base", "merge", "workflow", "repository", "pr", "run_id", "attempt"]
                  obj(expected_binding, binding_keys)
                  for key in binding_keys[:4]:
                      sha(expected_binding[key], 40)
                  check(expected_binding["repository"] == "zeroclaw-labs/zeroclaw")
                  check(type(expected_binding["pr"]) is int and expected_binding["pr"] == 11364)
                  for key in ["run_id", "attempt"]:
                      check(type(expected_binding[key]) is str and re.fullmatch(r"[1-9][0-9]{0,19}", expected_binding[key]) is not None)
                  step_keys = ["PREPARE_OUTCOME", "TOOLCHAIN_OUTCOME", "CACHE_OUTCOME", "SETUP_OUTCOME", "LIST_OUTCOME", "TEST_OUTCOME"]
                  obj(states, step_keys)
                  check(all(states[key] == "success" for key in step_keys[:-1]) and states["TEST_OUTCOME"] == "failure")
                  obj(phase, ["binding", "commands", "named_failure_committed"])
                  check(phase["binding"] == expected_binding and phase["named_failure_committed"] is True)
                  obj(src, ["binding", "tree", "parents", "file_sha256", "arduino_blob", "body_hash_basis", "body_sha256", "merge_base_workflow_fields"])
                  check(src["binding"] == expected_binding and src["parents"] == [parent])
                  sha(src["tree"], 40)
                  check(src["arduino_blob"] == "028627cb1907b9aace3cec9f6bb9a9e7200702cb")
                  check(src["body_sha256"] == dict(zip(names, body_hashes)))
                  check(src["body_hash_basis"] == "Pinned inventory bound by complete unchanged Arduino bytes, not a new Rust AST extraction")
                  check(src["merge_base_workflow_fields"] == "Official event descriptors, distinct from the explicitly checked-out head")
                  hashes = src["file_sha256"]
                  obj(hashes, [arduino, workflow, "Cargo.lock", "Cargo.toml", "crates/zeroclaw-hardware/Cargo.toml"])
                  expected_hashes = {
                      arduino: "56d246bdd3103249d6b8b7eba9294e40ebd025e3d716d3b8eb8424d9435323dc",
                      "Cargo.lock": "4294db86b3307b07bfb67f1c10b3bd686069c6b2b2dbfae39af54c58846410ad",
                      "Cargo.toml": "4c955ec6672a3a255f4962a21c821e468e89424cd9b4937660f0f40a898745ba",
                      "crates/zeroclaw-hardware/Cargo.toml": "7f8d1fd77e33cff1deb4b2fc81d8e8eec485bf0d78b1a36ef7dfba09b5fcf466",
                  }
                  check(all(hashes[key] == value for key, value in expected_hashes.items()))
                  sha(hashes[workflow], 64)
                  obj(selected, ["binding", "selected", "selected_ignored", "excluded_before_run", "excluded_reasons", "list_sha256", "executable"])
                  check(selected["binding"] == expected_binding and selected["selected"] == sorted(names))
                  integer(selected["selected_ignored"], 0, 0)
                  integer(selected["excluded_before_run"], 0, 2097152)
                  obj(selected["excluded_reasons"], ["expression", "ignored"])
                  for value in selected["excluded_reasons"].values():
                      integer(value, 0, 2097152)
                  check(sum(selected["excluded_reasons"].values()) == selected["excluded_before_run"])
                  sha(selected["list_sha256"], 64)
                  executable = selected["executable"]
                  obj(executable, ["sha256", "bytes", "relative_path"])
                  sha(executable["sha256"], 64)
                  integer(executable["bytes"], 1, 268435456)
                  check(type(executable["relative_path"]) is str and re.fullmatch(r"target/(?:x86_64-pc-windows-msvc/)?debug/deps/zeroclaw_hardware-[0-9a-f]{16}\.exe", executable["relative_path"]) is not None)
                  obj(platform_data, ["binding", "runner_label", "image", "compiler", "cargo", "nextest", "nextest_executable_sha256", "cache"])
                  check(platform_data["binding"] == expected_binding and platform_data["runner_label"] == "windows-latest")
                  obj(platform_data["image"], ["ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH"])
                  check(all(type(x) is str and re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", x) is not None for x in platform_data["image"].values()))
                  check(platform_data["image"]["RUNNER_OS"] == "Windows" and platform_data["image"]["RUNNER_ARCH"] == "X64")
                  check(re.fullmatch(r"rustc 1\.98\.0 \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\)\nbinary: rustc\ncommit-hash: [0-9a-f]{40}\ncommit-date: [0-9]{4}-[0-9]{2}-[0-9]{2}\nhost: x86_64-pc-windows-msvc\nrelease: 1\.98\.0\nLLVM version: [0-9.]+", platform_data["compiler"]) is not None)
                  check(re.fullmatch(r"cargo 1\.98\.0 \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\)", platform_data["cargo"]) is not None)
                  check(re.fullmatch(r"cargo-nextest 0\.9\.143(?: \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\))?", platform_data["nextest"]) is not None)
                  sha(platform_data["nextest_executable_sha256"], 64)

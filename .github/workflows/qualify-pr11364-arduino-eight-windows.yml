          def command_receipt(phase):
              value = load(root() / "private" / (phase + "-commands.json"))
              allowed = [LIST, RUN, ["rustc", "-vV"], ["cargo", "-V"], ["cargo", "nextest", "-V"]]
              for args in [["rev-list", "--parents", "-n", "1", "HEAD"], ["diff-tree", "--no-commit-id", "--name-status", "-r", ANCESTOR, "HEAD"], ["status", "--porcelain=v1", "--untracked-files=all"], ["rev-parse", "HEAD:" + ARDUINO], ["rev-parse", "HEAD^{tree}"]]:
                  allowed.append(["git", "-c", "core.fsmonitor=false", "-c", "core.hooksPath=NUL", "-c", "core.attributesFile=NUL", *args])
              return public_command_phase(value, phase, binding(), allowed)

          def main(phase):
              named_failure_state = {"named_failure_committed": False} if phase == "test" else None
              global DEADLINE
              DEADLINE = time.monotonic() + {"prepare": 100, "setup": 100, "list": 2690, "test": 290, "verify": 100}[phase]
              os.environ.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="NUL", GIT_CONFIG_SYSTEM="NUL", GIT_ATTR_NOSYSTEM="1", GIT_TERMINAL_PROMPT="0")
              r = root()
              try:
                  if phase == "prepare":
                      diagnostic_selftests()
                      r.mkdir(); (r / "private").mkdir()
                      shutil.copyfile(__file__, r / "harness.py")
                      put(r / "private/source.json", source())
                  elif phase == "setup":
                      require(source() == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-pc-windows-msvc.tar.gz"
                      archive = r / "private/nextest.tar.gz"
                      with urllib.request.urlopen(url, timeout=5) as response, archive.open("xb") as f:
                          total = 0
                          while True:
                              require(time.monotonic() < DEADLINE, "E_DOWNLOAD_TIMEOUT")
                              block = response.read(65536)
                              if not block:
                                  break
                              total += len(block); require(total <= 67108864, "E_ARCHIVE_CAP"); f.write(block)
                      require(digest(read(archive, 67108864)) == "c42a1dbde532da06dc9b4a43d44fd0ce668b836c2ab7388410f10ff9834476a2", "E_NEXTEST_CHECKSUM")
                      with tarfile.open(archive, "r:gz") as tar:
                          entries = tar.getmembers(); require(len(entries) <= 128, "E_ARCHIVE_SCHEMA")
                          chosen = [x for x in entries if Path(x.name).name == "cargo-nextest.exe"]
                          require(len(chosen) == 1 and chosen[0].isfile() and 0 < chosen[0].size <= 67108864, "E_ARCHIVE_SCHEMA")
                          with tar.extractfile(chosen[0]) as f:
                              tool = f.read(67108865)
                          require(len(tool) == chosen[0].size, "E_ARCHIVE_CAP")
                      toolpath = Path(shutil.which("cargo")).parent / "cargo-nextest.exe"
                      toolpath.write_bytes(tool)
                      require(read(toolpath, 67108864) == tool, "E_INSTALL")
                      require(Path(shutil.which("cargo-nextest")).resolve() == toolpath.resolve(), "E_NEXTEST_RESOLUTION")
                      require(toolpath.parent.resolve() == (Path(os.environ.get("CARGO_HOME", str(Path.home() / ".cargo"))) / "bin").resolve(), "E_NEXTEST_RESOLUTION")
                      compiler = meta(["rustc", "-vV"])
                      cargo = meta(["cargo", "-V"])
                      version = meta(["cargo", "nextest", "-V"])
                      require(compiler.startswith("rustc 1.98.0 ") and "\nhost: x86_64-pc-windows-msvc\n" in compiler and "\nrelease: 1.98.0\n" in compiler, "E_COMPILER")
                      require(re.fullmatch(r"cargo 1\.98\.0 \([0-9a-f]+ [0-9-]+\)", cargo), "E_COMPILER")
                      require(re.fullmatch(r"cargo-nextest 0\.9\.143(?: .*)?", version), "E_NEXTEST_VERSION")
                      image = {x: os.environ.get(x, "") for x in ["ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH"]}
                      require(all(re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", v) for v in image.values()), "E_RUNNER_METADATA")
                      cache = os.environ["CACHE_HIT"]
                      require(cache in ["true", "false"], "E_CACHE_OUTPUT")
                      put(r / "private/platform.json", {"binding": binding(), "runner_label": "windows-latest", "image": image,
                          "compiler": compiler, "cargo": cargo, "nextest": version, "nextest_executable_sha256": digest(tool),
                          "cache": {"action": "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6", "shared_key": "platform-test", "save": False,
                              "exact_match_output": cache, "key_and_restore_source": "Independent official Restore-only Rust cache step log readback required; false alone does not distinguish fallback from miss"}})
                  elif phase == "list":
                      require(source() == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      platform_receipt()
                      out, err = execute(LIST, 2700, (2097152, 16777216))
                      (r / "private/list.json").write_bytes(out)
                      (r / "private/build.log").write_bytes(err)
                      put(r / "private/selection.json", selection())
                  elif phase == "test":
                      src = source()
                      require(src == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      pdata = platform_receipt()
                      selected = selection()
                      require(selected == load(r / "private/selection.json"), "E_SELECTION_DRIFT")
                      # Two pipes are merged only after bounded capture. Nextest's
                      # human reporter is stderr; stdout must be empty on success.
                      out, err = execute(RUN, 300, (2097152, 2097152),
                                         named_failure_context=diagnostic_context(src, selected, pdata),
                                         named_failure_state=named_failure_state,
                                         named_failure_writer=lambda: (r / "private/named-failure-decision.json").open("xb"))
                      require(not out and len(err) <= 2097152, "E_TEST_STDOUT")
                      (r / "private/test.log").write_bytes(err.replace(b"\r\n", b"\n"))
                      require(selection() == load(r / "private/selection.json"), "E_BINARY_DRIFT")
                      put(r / "private/outcome.json", outcomes(selection()))
                  elif phase == "verify":
                      require(all(os.environ[x] == "success" for x in ["PREPARE_OUTCOME", "TOOLCHAIN_OUTCOME", "CACHE_OUTCOME", "SETUP_OUTCOME", "LIST_OUTCOME", "TEST_OUTCOME"]), "E_PREVIOUS_STEP")
                      require(source() == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      platform_receipt()
                      sel = selection(); require(sel == load(r / "private/selection.json"), "E_BINARY_DRIFT")
                      require(outcomes(sel) == load(r / "private/outcome.json"), "E_OUTCOME_DRIFT")
                      export = r / "success"; export.mkdir()
                      names = ["source.json", "platform.json", "selection.json", "outcome.json", "commands.json", "test.log"]
                      for name in names[:4]:
                          value = load(r / "private" / name)
                          require(value["binding"] == binding(), "E_EXPORT_BINDING")
                          put(export / name, value)
                      put(export / "commands.json", {"binding": binding(), "phases": [command_receipt(x) for x in ["prepare", "setup", "list", "test"]]})
                      (export / "test.log").write_bytes(read(r / "private/test.log", 2097152))
                      require(set(x.name for x in export.iterdir()) == set(names), "E_EXPORT_WHITELIST")
                      inventory = {x: {"bytes": (export / x).stat().st_size, "sha256": digest(read(export / x, 2097152 if x == "test.log" else 65536))} for x in names}
                      require(sum(x["bytes"] for x in inventory.values()) <= 20971520, "E_EXPORT_CAP")
                      put(export / "decision.json", {"binding": binding(), "safe_export": True, "inventory": inventory})
                      require(set(x.name for x in export.iterdir()) == set(names + ["decision.json"]), "E_EXPORT_WHITELIST")
                      require(sum(x.stat().st_size for x in export.iterdir()) <= 20971520, "E_EXPORT_CAP")
                      # Decision is written only after complete source/selection/
                      # named-result/privacy validation; failed finalizer emits none.
                      with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                          f.write("success_export=true\n")
              except BaseException as error:
                  code = str(error) if isinstance(error, Refusal) else "E_UNEXPECTED"
                  require(re.fullmatch(r"E_[A-Z_]+", code), "E_CODE")
                  if (r / "private").is_dir():
                      put(r / "private" / (phase + "-failure.json"), {"binding": binding(), "code": code})
                  print("::error::PR11364 evidence refused: " + code)
                  raise SystemExit(1)
              finally:
                  if (r / "private").is_dir():
                      put(r / "private" / (phase + "-commands.json"),
                          phase_receipt_payload(phase, binding(), COMMANDS, named_failure_state))

          if __name__ == "__main__":
              main(sys.argv[1] if len(sys.argv) == 2 else "prepare")

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1

                           "-c", "core.attributesFile=NUL", *args])

          def source():
              b = binding()
              parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
              require(parents == [b["head"], EXPECTED_PARENT], "E_PARENT")
              require(git("diff-tree", "--no-commit-id", "--name-status", "-r", ANCESTOR, "HEAD") == "A\t" + WORKFLOW, "E_SOURCE_SCOPE")
              require(not git("status", "--porcelain=v1", "--untracked-files=all"), "E_WORKTREE")

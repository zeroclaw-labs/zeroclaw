                      "body_hash_basis": "Pinned inventory bound by complete unchanged Arduino bytes, not a new Rust AST extraction",
                      "body_sha256": dict(zip(EXPECTED, BODY_HASHES)),
                      "merge_base_workflow_fields": "Official event descriptors, distinct from the explicitly checked-out head"}

          def executable(path):
              p = Path(path).resolve()
              require(p.is_relative_to((Path.cwd() / "target").resolve()) and p.suffix.lower() == ".exe", "E_BINARY_PATH")
              relative = p.relative_to(Path.cwd()).as_posix()
              require(re.fullmatch(r"target/(?:x86_64-pc-windows-msvc/)?debug/deps/zeroclaw_hardware-[0-9a-f]{16}\.exe", relative), "E_BINARY_PATH")
              return {"sha256": digest(read(p, 268435456)), "bytes": p.stat().st_size,
                      "relative_path": relative}

          def selection():
              j = load(root() / "private/list.json", 2097152)
              require(set(j) == {"rust-build-meta", "test-count", "rust-suites"}, "E_LIST_SCHEMA")
              require(type(j["test-count"]) is int and j["test-count"] >= 8, "E_LIST_COUNT")
              require(type(j["rust-suites"]) is dict and set(j["rust-suites"]) == {"zeroclaw-hardware"}, "E_SUITE")
              s = j["rust-suites"]["zeroclaw-hardware"]
              require(set(s) == {"package-name", "binary-id", "binary-name", "package-id", "kind", "binary-path", "build-platform", "cwd", "status", "testcases"}, "E_SUITE_SCHEMA")
              require(s["package-name"] == s["binary-id"] == "zeroclaw-hardware" and s["binary-name"] == "zeroclaw_hardware" and s["kind"] == "lib" and s["status"] == "listed" and s["build-platform"] == "target", "E_SUITE")
              require(Path(s["cwd"]).resolve() == (Path.cwd() / "crates/zeroclaw-hardware").resolve(), "E_SUITE_CWD")
              require(type(s["testcases"]) is dict and len(s["testcases"]) == j["test-count"], "E_LIST_COUNT")
              matched, excluded = [], {"expression": 0, "ignored": 0}
              for name, case in s["testcases"].items():
                  require(re.fullmatch(r"[A-Za-z0-9_:]+", name), "E_TEST_NAME")
                  require(set(case) == {"kind", "ignored", "filter-match"} and case["kind"] == "test" and type(case["ignored"]) is bool, "E_CASE_SCHEMA")
                  f = case["filter-match"]
                  if f == {"status": "matches"}:
                      require(case["ignored"] is False, "E_SELECTED_IGNORED"); matched.append(name)
                  else:
                      require(not name.startswith(MODULE), "E_SELECTED_SKIPPED")
                      require(f == {"status": "mismatch", "reason": "expression"} or (case["ignored"] is True and f == {"status": "mismatch", "reason": "ignored"}), "E_FILTER_SCHEMA")
                      excluded[f["reason"]] += 1

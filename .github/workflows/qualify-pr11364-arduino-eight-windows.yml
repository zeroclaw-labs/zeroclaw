              # Known root metadata keys are checked, but values unrelated to
              # selection remain opaque/private: build-script-info includes envs.
              bm = j["rust-build-meta"]
              require(type(bm) is dict and set(bm) <= {"target-directory", "build-directory", "base-output-directories", "non-test-binaries", "build-script-out-dirs", "build-script-info", "linked-paths", "platforms", "target-platforms", "target-platform"}, "E_BUILD_META_SCHEMA")
              require({"target-directory", "base-output-directories", "non-test-binaries", "linked-paths"} <= set(bm), "E_BUILD_META_SCHEMA")
              return {"binding": binding(), "selected": sorted(matched), "selected_ignored": 0,
                      "excluded_before_run": j["test-count"] - 8, "excluded_reasons": excluded,
                      "list_sha256": digest(read(root() / "private/list.json", 2097152)),
                      "executable": executable(s["binary-path"])}

          def outcomes(sel):
              raw = read(root() / "private/test.log", 2097152)
              text = raw.decode("utf-8")
              require(text.endswith("\n") and "\x1b" not in text and "\r" not in text, "E_LOG_ENCODING")
              lines = [x.strip() for x in text.splitlines() if x.strip()]
              seen, indices, starts, summaries, ids, bars, finished = [], [], 0, 0, [], 0, 0
              excluded = sel["excluded_before_run"]
              suffix = "" if not excluded else " (" + str(excluded) + (" test" if excluded == 1 else " tests") + " skipped)"
              for line in lines:
                  m = re.fullmatch(r"PASS \[ *[0-9]+\.[0-9]{3}s\] \( *([1-8])/8\) zeroclaw-hardware (peripherals::arduino_upload::tests::[a-z_]+)", line)
                  if m:
                      require(m[2] in EXPECTED, "E_EXTRA_RESULT"); seen.append(m[2]); indices.append(int(m[1])); continue
                  m = re.fullmatch(r"Nextest run ID ([0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}) with nextest profile: default", line)
                  if m:
                      ids.append(m[1]); continue
                  if line == "Starting 8 tests across 1 binary" + suffix:
                      starts += 1; continue
                  if re.fullmatch(r"Summary \[ *[0-9]+\.[0-9]{3}s\] 8 tests run: 8 passed, " + str(excluded) + " skipped", line):
                      summaries += 1; continue
                  if line in ["────────────", "------------"]:
                      bars += 1; continue
                  if re.fullmatch(r"Finished `test` profile \[unoptimized \+ debuginfo\] target\(s\) in [0-9]+\.[0-9]{2}s", line):
                      finished += 1; continue
                  raise Refusal("E_UNKNOWN_RESULT_OR_PRIVACY")
              require(len(seen) == 8 and set(seen) == set(EXPECTED) and sorted(indices) == list(range(1, 9)), "E_NAMED_PASS")
              require(starts == summaries == len(ids) == 1 and bars == 2 and finished <= 1, "E_SUMMARY")
              return {"binding": binding(), "named_pass": seen, "nextest_run_id": ids[0],
                      "summary": {"run": 8, "passed": 8, "selected_skipped": 0, "excluded_before_run": excluded},
                      "test_log_sha256": digest(raw)}

          def platform_receipt():
              value = load(root() / "private/platform.json")

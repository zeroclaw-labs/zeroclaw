name: Docker Publish

# Builds and pushes the canonical image tag matrix to GHCR. The matrix is
# generated from the install spec (`cargo generate installers`) into
# dev/ci/docker-tags.toml; this workflow consumes it so published tags can never
# drift from the spec. Each entry produces an immutable version-pinned tag
# (Alpine-style `<stem>-v<version>`) and a floating tag (`<stem>`).
#
# Images are pushed with the canonical platform matrix first, signed by digest,
# then the pinned tag is scanned in report-only mode (exit-code: 0). Enforcement
# flips in a follow-up after the baseline is triaged.
#
# A manual dispatch builds without pushing unless `push` is set, so it doubles
# as a dry run of the release legs. To rebuild one variant of a published
# release with this workflow, dispatch from master with `release_ref` set to the
# tag and `stems` naming the variant; other pinned tags are left untouched.
# Floating tags (`<stem>` and the relay's `latest`) move on a tag push and on
# the release call. A dispatch leaves them alone unless `floating` is set, so a
# rebuild of an older release cannot move them back to that release.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_ref:
        description: "Immutable release tag to build (vX.Y.Z)"
        required: true
        type: string
      push:
        description: "Push and sign the images"
        required: false
        type: boolean
        default: true
      floating:
        description: "Also move the floating tags (<stem>, relay latest)"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag to build (vX.Y.Z); empty builds the dispatch ref"
        required: false
        type: string
      stems:
        description: "Comma-separated docker-tags.toml stems (e.g. dist); empty builds every stem and the relay"
        required: false
        type: string
      push:
        description: "Push and sign the images; leave off for a dry run"
        required: false
        type: boolean
        default: false
      floating:
        description: "Also move the floating tags (<stem>, relay latest); only for the newest release"
        required: false
        type: boolean
        default: false

# A dry run gets a group of its own, so it can neither queue behind a publish
# nor, as the newer pending entry, cancel a pending one. Publishes of the same
# release ref stay serialized; the tag push and the release call name the same
# release the same way.
concurrency:
  group: ${{ (inputs.push || github.event_name == 'push') && format('docker-publish-{0}', inputs.release_ref || github.ref_name) || format('docker-publish-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read
  # OIDC, package write, and security-events permissions are granted only to
  # the jobs that need them.

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  matrix:
    name: Resolve tag matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Read generated docker-tags.toml into a build matrix
        id: read
        env:
          STEMS: ${{ inputs.stems }}
        run: |
          # Convert the canonical TOML matrix to the JSON the Actions matrix
          # consumes. yq ships on ubuntu-latest runners.
          include="$(yq -o=json -I=0 '.tags' dev/ci/docker-tags.toml)"
          if [ -n "${STEMS}" ]; then
            want="$(jq -cn --arg stems "${STEMS}" \
              '$stems | split(",") | map(gsub("^\\s+|\\s+$"; "") | select(. != ""))')"
            # Fail on any unknown name, not only when all are unknown, so a
            # typo can't drop a variant from a green run. The names are
            # JSON-quoted and % escaped to keep user input on one line.
            unknown="$(jq -r --argjson want "${want}" \
              'map(.stem) as $known
               | [$want[] | select(. as $w | $known | index($w) | not) | @json]
               | join(", ") | gsub("%"; "%25")' <<< "${include}")"
            if [ -n "${unknown}" ]; then
              echo "::error title=Unknown stem::No docker-tags.toml stem named ${unknown}"
              exit 1
            fi
            include="$(jq -c --argjson want "${want}" \
              'map(select(.stem as $s | $want | index($s)))' <<< "${include}")"
            if [ "${include}" = "[]" ]; then
              echo "::error title=Unknown stem::stems lists no stem name"
              exit 1
            fi
          fi
          echo "include=${include}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build & push ${{ matrix.stem }}
    if: github.repository == 'zeroclaw-labs/zeroclaw'
    needs: [matrix]
    runs-on: ubuntu-latest
    # A multi-platform leg builds amd64 and arm64 one after the other (see the
    # Buildx setup below), and the all-features Containerfile leg alone takes
    # 41-64 min in docker-image-pr.yml with a warm cache.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write   # required for keyless cosign OIDC signing of container images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      # The image must report the commit it was built from, not the caller's
      # ambient sha: on the workflow_call release path the two differ.
      - name: Resolve the commit being built
        id: srcsha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      # The arm64 cross-build of the dist feature set exhausts the hosted
      # runner's memory in its final fat-LTO link: the same Dockerfile leg in
      # docker-image-pr.yml fails with ResourceExhausted. Add the bounded swap
      # the release workflow gives its Linux ARM64 build, and let BuildKit run
      # one step at a time so the amd64 and arm64 links never overlap.
      # The helper comes from this workflow's own revision, because a
      # release_ref can predate it. It goes to RUNNER_TEMP, outside the build
      # context, so the image source stays exactly release_ref.
      - name: Fetch the build memory helper
        id: memory_helper
        if: contains(matrix.platforms, 'linux/arm64')
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_WORKFLOW_SHA}"
          git show "${GITHUB_WORKFLOW_SHA}:scripts/ci/dist_runner_memory.sh" \
            > "${RUNNER_TEMP}/dist_runner_memory.sh"

      - name: Prepare bounded build memory
        id: dist_memory
        if: contains(matrix.platforms, 'linux/arm64')
        timeout-minutes: 5
        shell: bash
        run: bash "${RUNNER_TEMP}/dist_runner_memory.sh" prepare

      - name: Set up Buildx (one step at a time)
        if: contains(matrix.platforms, 'linux/arm64')
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Set up Buildx
        if: ${{ !contains(matrix.platforms, 'linux/arm64') }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push pinned + floating tags
        id: build-push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push || github.event_name == 'push' }}
          # Platforms are resolved per tag from the generated matrix: Dockerfile
          # tags build amd64+arm64 (the Dockerfile cross-compiles to arm64 on the
          # native amd64 builder), Containerfile tags stay amd64-only.
          platforms: ${{ matrix.platforms }}
          build-args: |
            ZEROCLAW_CARGO_FLAGS=${{ matrix.flags }}
            ZEROCLAW_BUILD_ID=${{ steps.srcsha.outputs.sha }}
          # The floating tag moves only on a tag push, the release call, or a
          # dispatch with `floating` set; an empty line adds no tag.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.pinned_tag }}
            ${{ (inputs.floating || github.event_name == 'push') && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE, matrix.floating_tag) || '' }}

      - name: Sign container image (keyless / Rekor)
        if: ${{ inputs.push || github.event_name == 'push' }}
        # Signs by digest so the signature is immutable regardless of tag mutations.
        # Consumers verify with:
        #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp "^https://github.com/zeroclaw-labs/zeroclaw/" \
        #     ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build-push.outputs.digest }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${DIGEST}"

      - name: Report and release owned build memory
        if: always() && contains(matrix.platforms, 'linux/arm64') && steps.memory_helper.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        env:
          ZC_DIST_SWAP_FILE: ${{ steps.dist_memory.outputs.swap_file }}
          ZC_DIST_SWAP_IDENTITY: ${{ steps.dist_memory.outputs.swap_identity }}
        run: bash "${RUNNER_TEMP}/dist_runner_memory.sh" cleanup

  # The nominated relay (zerorelay) ships as its OWN distroless image from
  # apps/zerorelay/Dockerfile (it holds no keys and is deployed independently of
  # any daemon). It is not part of the install-spec tag matrix above, so it gets a
  # dedicated job: a version-pinned tag on a release and a floating `latest`.
  publish-relay:
    name: Build & push zerorelay
    # A dispatch that names stems rebuilds only those image variants.
    if: github.repository == 'zeroclaw-labs/zeroclaw' && !inputs.stems
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write   # required for keyless cosign OIDC signing of container images
    outputs:
      image: ${{ steps.tags.outputs.image }}
      pinned: ${{ steps.tags.outputs.pinned }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Build the relay image from the SAME immutable ref as the main image
          # matrix, so a workflow_call release publishes the requested source ref
          # rather than the caller/default ref.
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Resolve the commit being built
        id: srcsha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Compute relay image tags
        id: tags
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [ -n "${RELEASE_REF}" ]; then
            # workflow_call release: pin to the immutable release ref the caller
            # requested (matching the main image matrix), not the triggering ref.
            pinned="${{ env.REGISTRY }}/${{ env.IMAGE }}-zerorelay:${RELEASE_REF}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pinned="${{ env.REGISTRY }}/${{ env.IMAGE }}-zerorelay:${GITHUB_REF_NAME}"
          else
            pinned="${{ env.REGISTRY }}/${{ env.IMAGE }}-zerorelay:sha-${GITHUB_SHA::12}"
          fi
          {
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE }}-zerorelay"
            echo "pinned=${pinned}"
            echo "floating=${{ env.REGISTRY }}/${{ env.IMAGE }}-zerorelay:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the relay image
        id: build-push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          file: apps/zerorelay/Dockerfile
          push: ${{ inputs.push || github.event_name == 'push' }}
          build-args: |
            ZEROCLAW_BUILD_ID=${{ steps.srcsha.outputs.sha }}
          tags: |
            ${{ steps.tags.outputs.pinned }}
            ${{ (inputs.floating || github.event_name == 'push') && steps.tags.outputs.floating || '' }}

      - name: Sign relay container image (keyless / Rekor)
        if: ${{ inputs.push || github.event_name == 'push' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.tags.outputs.image }}@${DIGEST}"

  scan:
    name: Scan ${{ matrix.stem }}
    if: github.repository == 'zeroclaw-labs/zeroclaw' && (inputs.push || github.event_name == 'push')
    needs: [matrix, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan pinned tag with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-dirs: /usr/share/zoneinfo
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.pinned_tag }}
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-${{ matrix.stem }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

  scan-relay:
    name: Scan zerorelay
    if: github.repository == 'zeroclaw-labs/zeroclaw' && (inputs.push || github.event_name == 'push')
    needs: [publish-relay]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Scan relay pinned tag with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-dirs: /usr/share/zoneinfo
          image-ref: ${{ needs.publish-relay.outputs.pinned }}
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Upload relay Trivy SARIF artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-zerorelay
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

  upload-sarif:
    name: Upload SARIF ${{ matrix.stem }}
    if: github.repository == 'zeroclaw-labs/zeroclaw'
    needs: [matrix, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Download Trivy SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-results-${{ matrix.stem }}

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif

  upload-relay-sarif:
    name: Upload SARIF zerorelay
    if: github.repository == 'zeroclaw-labs/zeroclaw'
    needs: [scan-relay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download relay Trivy SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-results-zerorelay

      - name: Upload relay Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif

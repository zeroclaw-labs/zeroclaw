name: npm Dependency Review

on:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  rsc-exception-expiry:
    name: Check RSC advisory exception expiry
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify the temporary exception remains valid
        run: bash scripts/ci/web_rsc_mode_guard.sh

          {
            "name": "secret access",
            "paths": [".github/workflows/**", ".github/actions/**", "scripts/**", "dev/**"],
            "pattern": "(?:\\bsecrets\\.|\\bsecrets\\s*:|\\$\\{\\{\\s*secrets\\.)"
          },
          {
            "name": "OIDC token access",
            "paths": [".github/workflows/**"],
            "pattern": "^\\s*id-token:\\s*write\\s*(?:#.*)?$"
          },
          {
            "name": "artifact publication",
            "paths": [".github/workflows/**"],
            "pattern": "(?:actions/(?:upload|download)-artifact|actions/attest|gh\\s+release\\s+(?:create|upload)|cargo\\s+publish|docker/(?:login|build-push)-action|push:\\s*true)"
          },
          {
            "name": "release behavior",
            "paths": [".github/workflows/**", "scripts/release/**", "docs/book/src/maintainers/release-runbook.md"],
            "pattern": "(?:\\brelease\\b|\\btags\\s*:|\\bv[0-9]+\\.[0-9]+\\.[0-9]+\\b)"
          },
          {

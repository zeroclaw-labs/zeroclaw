          {
            "name": "toolchain install or container baseline",
            "paths": [".github/workflows/**", ".github/actions/**", "scripts/**", "dev/**", "Dockerfile", "**/Dockerfile", "Containerfile", "**/Containerfile"],
            "pattern": "(?:\\bFROM\\s+|\\bcargo\\s+install\\b|\\b(?:curl|wget)\\b.*\\|\\s*(?:sh|bash)|\\b(?:apt-get|apt|brew|npm|pnpm|yarn)\\s+install\\b|\\bdocker\\s+(?:build|pull|push)\\b)"

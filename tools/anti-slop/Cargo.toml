[package]
name = "zeroclaw-anti-slop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "anti-slop"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3.26"

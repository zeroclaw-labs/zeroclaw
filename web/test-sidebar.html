<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Test - 800x500</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e5e5e5;
        }
        .test-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 9999;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 56px;
            background: #2a2a2a;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }
        .rail-logo {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #404040;
        }
        .rail-logo img {
            width: 32px;
            height: 32px;
        }
        .rail-nav {
            flex: 1;
            overflow-y: auto;
            overflow-x: clip;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-item {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #333;
            color: #a3a3a3;
            cursor: pointer;
            position: relative;
        }
        .nav-item:hover {
            background: #404040;
            color: #e5e5e5;
        }
        .nav-item.active {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: #3b82f6;
            border-radius: 9999px;
        }
        .nav-icon {
            width: 22px;
            height: 22px;
        }
        .rail-footer {
            height: 56px;
            border-top: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #737373;
        }
        /* Tooltip */
        .tooltip {
            position: fixed;
            z-index: 9999;
            padding: 4px 8px;
            background: #404040;
            color: #e5e5e5;
            border: 1px solid #525252;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            transform: translateY(-50%);
        }
        .tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <div><strong>Viewport:</strong> 800×500</div>
        <div><strong>Test:</strong> Sidebar horizontal overflow</div>
        <div><strong>Status:</strong> <span id="status">Testing...</span></div>

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>

        <div class="rail-footer">
            <span>v0.8.3</span>
        </div>
    </aside>

    <!-- Tooltip element -->
    <div id="tooltip" class="tooltip"></div>

    <script>
        // Setup tooltips
        const tooltip = document.getElementById('tooltip');
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('mouseenter', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const railRect = document.querySelector('aside').getBoundingClientRect();
                tooltip.textContent = item.getAttribute('data-label');
                tooltip.style.top = (rect.top + rect.height / 2) + 'px';
                tooltip.style.left = (railRect.right + 8) + 'px';
                tooltip.classList.add('visible');
            });
            
            item.addEventListener('mouseleave', () => {
                tooltip.classList.remove('visible');
            });
            
            item.addEventListener('focus', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const railRect = document.querySelector('aside').getBoundingClientRect();
                tooltip.textContent = item.getAttribute('data-label');
                tooltip.style.top = (rect.top + rect.height / 2) + 'px';
                tooltip.style.left = (railRect.right + 8) + 'px';
                tooltip.classList.add('visible');
            });
            
            item.addEventListener('blur', () => {
                tooltip.classList.remove('visible');
            });
        });

        // Measure and report
        setTimeout(() => {
            const nav = document.querySelector('nav.rail-nav');
            const measurements = {
                scrollWidth: nav.scrollWidth,
                clientWidth: nav.clientWidth,
                scrollHeight: nav.scrollHeight,
                clientHeight: nav.clientHeight,
                overflowX: getComputedStyle(nav).overflowX,
                overflowY: getComputedStyle(nav).overflowY
            };
            
            const hasHorizontalOverflow = measurements.scrollWidth > measurements.clientWidth;
            
            document.getElementById('status').textContent = hasHorizontalOverflow 
                ? '❌ FAIL: Horizontal overflow detected' 
                : '✅ PASS: No horizontal overflow';
            document.getElementById('status').style.color = hasHorizontalOverflow ? '#f87171' : '#4ade80';
            
            // Output measurements for automation
            console.log('=== MEASUREMENTS ===');
            console.log(JSON.stringify(measurements, null, 2));
            console.log('Has horizontal overflow:', hasHorizontalOverflow);
            
            // Save to window for Playwright to access
            window.sidebarMeasurements = {
                ...measurements,
                hasHorizontalOverflow,
                pass: !hasHorizontalOverflow
            };
        }, 1000);
    </script>
</body>
</html>
